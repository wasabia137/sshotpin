<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; user-select: none; background: transparent; }
  #canvas { width: 100vw; height: 100vh; display: block; }
  #frame {
    position: absolute; inset: 0;
    pointer-events: none;
    border: 2px solid var(--border-color, #3b82f6);
    display: none;
  }
  body.bordered #frame { display: block; }
  #collapsed {
    display: none;
    width: 100vw; height: 100vh;
    background: #1e293b; color: #e2e8f0;
    font: 13px 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif;
    align-items: center; justify-content: center; gap: 6px;
    border: 1px solid #3b82f6; border-radius: 6px;
    white-space: nowrap; overflow: hidden;
  }
  body.collapsed #canvas, body.collapsed #frame { display: none; }
  body.collapsed #collapsed { display: flex; }

  /* 모퉁이 크기 조절 — 스니페이스트처럼 끌어서 조절 */
  .grip { position: absolute; width: 16px; height: 16px; z-index: 5; }
  .grip.nw { top: 0; left: 0; cursor: nwse-resize; }
  .grip.ne { top: 0; right: 0; cursor: nesw-resize; }
  .grip.sw { bottom: 0; left: 0; cursor: nesw-resize; }
  .grip.se { bottom: 0; right: 0; cursor: nwse-resize; }
  /* 마우스를 올리면 조절 지점을 눈에 보이게 */
  .grip::after {
    content: ''; position: absolute; width: 8px; height: 8px;
    background: #fff; border: 2px solid #3b82f6; border-radius: 50%;
    opacity: 0; transition: opacity .12s;
  }
  .grip.nw::after { top: 1px; left: 1px; }
  .grip.ne::after { top: 1px; right: 1px; }
  .grip.sw::after { bottom: 1px; left: 1px; }
  .grip.se::after { bottom: 1px; right: 1px; }
  body:hover .grip::after { opacity: .85; }
  body.collapsed .grip, body.resizing .grip:not(.on)::after { display: none; }

  /* 닫기 버튼 — 마우스를 올리면 우측 위에 나타난다 */
  #close {
    position: absolute; top: 6px; right: 6px; z-index: 6;
    width: 22px; height: 22px; border-radius: 50%;
    background: rgba(15, 23, 42, .82); color: #fff;
    font: 700 13px/1 -apple-system, 'Malgun Gothic', sans-serif;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; opacity: 0; transition: opacity .12s, background .12s;
    border: 1px solid rgba(255, 255, 255, .35);
  }
  body:hover #close { opacity: 1; }
  #close:hover { background: #ef4444; }
  body.collapsed #close, body.resizing #close { display: none; }
</style>
</head>
<body>
  <canvas id="canvas"></canvas>
  <div id="frame"></div>
  <div class="grip nw" data-c="nw" title="끌어서 크기 조절"></div>
  <div class="grip ne" data-c="ne" title="끌어서 크기 조절"></div>
  <div class="grip sw" data-c="sw" title="끌어서 크기 조절"></div>
  <div class="grip se" data-c="se" title="끌어서 크기 조절"></div>
  <div id="close" title="닫기 (Esc)">✕</div>
  <div id="collapsed">📌 스샷핀 (더블클릭 펼치기)</div>

<script>
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');
  const img = new Image();
  let id = null;
  let tf = { rot: 0, flipH: false, flipV: false, borderVisible: true, borderColor: '#3b82f6' };
  let dragging = false;
  let sx = 0, sy = 0;

  function render() {
    if (!img.naturalWidth) return;
    const rotated = tf.rot % 2 === 1;
    const w = img.naturalWidth, h = img.naturalHeight;
    canvas.width = rotated ? h : w;
    canvas.height = rotated ? w : h;
    ctx.save();
    ctx.translate(canvas.width / 2, canvas.height / 2);
    ctx.rotate(tf.rot * Math.PI / 2);
    ctx.scale(tf.flipH ? -1 : 1, tf.flipV ? -1 : 1);
    ctx.drawImage(img, -w / 2, -h / 2);
    ctx.restore();

    document.body.classList.toggle('bordered', tf.borderVisible);
    document.getElementById('frame').style.setProperty('--border-color', tf.borderColor);
    document.getElementById('frame').style.borderColor = tf.borderColor;
  }

  window.api.onPinInit((d) => {
    id = d.id;
    img.onload = render;
    img.src = d.dataURL;
  });
  window.api.onPinTransform((d) => { tf = d; render(); });
  window.api.onPinCollapse(({ collapsed }) => {
    document.body.classList.toggle('collapsed', collapsed);
  });

  let resizing = null;   // 모퉁이 크기 조절 중이면 'nw'|'ne'|'sw'|'se'

  window.addEventListener('mousedown', (e) => {
    if (e.button === 0) {
      if (e.target.closest && e.target.closest('#close')) {
        e.preventDefault();
        window.api.pinClose(id);
        return;
      }
      const grip = e.target.closest && e.target.closest('.grip');
      if (grip && !document.body.classList.contains('collapsed')) {
        // 모퉁이를 잡았으면 이동이 아니라 크기 조절
        resizing = grip.dataset.c;
        grip.classList.add('on');
        document.body.classList.add('resizing');
        sx = e.screenX; sy = e.screenY;
        window.api.pinResizeStart(id, resizing);
        e.preventDefault();
        return;
      }
      dragging = true;
      sx = e.screenX; sy = e.screenY;
      window.api.winDragStart();
    } else if (e.button === 1) {
      window.api.pinClose(id); // 휠 클릭 = 닫기
    }
  });
  window.addEventListener('mousemove', (e) => {
    if (resizing) window.api.pinResizeMove(id, e.screenX - sx, e.screenY - sy);
    else if (dragging) window.api.winDragMove(e.screenX - sx, e.screenY - sy);
  });
  function endGesture() {
    dragging = false;
    resizing = null;
    document.body.classList.remove('resizing');
    for (const g of document.querySelectorAll('.grip.on')) g.classList.remove('on');
  }
  window.addEventListener('mouseup', endGesture);
  window.addEventListener('blur', endGesture);

  window.addEventListener('wheel', (e) => {
    e.preventDefault();
    window.api.pinZoom(id, e.deltaY < 0 ? 1 : -1, e.ctrlKey);
  }, { passive: false });

  window.addEventListener('dblclick', (e) => {
    // 모퉁이는 크기 조절용이므로 접기로 오작동하지 않게
    if (e.target.closest && e.target.closest('.grip, #close')) return;
    window.api.pinToggleCollapse(id);
  });

  window.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') window.api.pinClose(id);
    else if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'c') window.api.pinCopy(id);
    else if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's') { e.preventDefault(); window.api.pinSave(id); }
    else if (e.key === '0') window.api.pinReset(id);
    else if (e.key === '1') window.api.pinRotate(id, 1);
    else if (e.key === '2') window.api.pinRotate(id, -1);
    else if (e.key === '3') window.api.pinFlip(id, 'h');
    else if (e.key === '4') window.api.pinFlip(id, 'v');
  });
</script>
</body>
</html>
