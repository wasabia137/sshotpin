<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; user-select: none; background: #000; cursor: crosshair; }
  /* 배경(스크린샷)과 판서를 나눠 그린다.
     그리는 중에는 배경을 다시 그릴 필요가 없어 펜이 훨씬 가볍게 따라온다. */
  #bg, #ink { position: absolute; left: 0; top: 0; width: 100vw; height: 100vh; display: block; }
  /* 도구모음 — 캡처 도구모음과 같은 모양: 흰 바탕에 선 아이콘 (이모지는 윈도우에서 뭉개진다) */
  #tb {
    position: absolute; bottom: 14px; left: 50%; transform: translateX(-50%);
    background: #fff;
    border: 1px solid rgba(0, 0, 0, .14);
    border-radius: 8px;
    padding: 6px 8px 5px;
    box-shadow: 0 8px 28px rgba(0, 0, 0, .28), 0 1px 3px rgba(0, 0, 0, .12);
    display: flex; flex-direction: column; gap: 4px;
    font: 12px 'Segoe UI Variable Text', 'Segoe UI', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif;
    color: #1b1b1b; cursor: default; white-space: nowrap;
  }
  #tb .row { display: flex; align-items: center; gap: 2px; }
  .sw {
    width: 20px; height: 20px; border-radius: 50%;
    border: 2px solid #fff; cursor: pointer; margin: 0 2px;
    box-shadow: 0 0 0 1px #c8c8c8;
  }
  .sw.on { box-shadow: 0 0 0 2px #005fb8; }
  .tbtn {
    min-width: 34px; height: 32px; padding: 0 6px;
    border: 1px solid transparent; border-radius: 6px;
    background: transparent; color: #1b1b1b;
    font: 14px 'Segoe UI Variable Text', 'Segoe UI', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
  }
  .tbtn svg { width: 20px; height: 20px; display: block; }
  .tbtn:hover { background: #ededed; }
  .tbtn:active { background: #e0e0e0; }
  .tbtn.on { background: #eaf3fc; border-color: #005fb8; color: #005fb8; }
  .sep { width: 1px; height: 22px; background: #e0e0e0; margin: 0 4px; }
  #penVal { min-width: 36px; text-align: center; color: #1b1b1b; font-size: 13px; }
  #zoomLabel { margin-left: 4px; color: #616161; min-width: 42px; font-size: 12px; }
  #hint { text-align: center; color: #616161; font-size: 12px; }

  /* 확대 모드 첫 안내 — 잠깐 보였다가 사라진다 */
  #zhint {
    position: absolute; top: 26px; left: 50%; transform: translateX(-50%);
    background: rgba(15, 23, 42, .85); color: #cbd5e1;
    font: 13px 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif;
    padding: 8px 18px; border-radius: 20px;
    /* 줄바꿈을 허용하면 안내가 두 줄로 접힌다 — 언어에 따라 길이가 제각각이라 한 줄로 고정 */
    white-space: nowrap;
    pointer-events: none; opacity: 0; transition: opacity .5s;
  }

  /* 확대 모드 배율 표시 — 배율을 바꾸는 동안만 보인다 */
  #zbadge {
    position: absolute; top: 26px; right: 26px;
    background: rgba(15, 23, 42, .85); color: #f1f5f9;
    font: 600 15px/1 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif;
    padding: 8px 14px; border-radius: 14px;
    pointer-events: none; opacity: 0; transition: opacity .35s;
  }
</style>
</head>
<body>
  <canvas id="bg"></canvas>
  <canvas id="ink"></canvas>
  <!-- 아이콘 원본. 버튼은 <use>로 가져다 쓴다 -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <g id="i-minus" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M5 12h14"/></g>
      <g id="i-plus" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></g>
      <g id="i-mosaic" stroke="currentColor" stroke-width="1.6" fill="none">
        <rect x="4" y="4" width="16" height="16" rx="1.5"/>
        <path d="M4 9.33h16M4 14.67h16M9.33 4v16M14.67 4v16"/>
        <path fill="currentColor" stroke="none" opacity=".35" d="M4 4h5.33v5.33H4zM9.33 9.33h5.34v5.34H9.33zM14.67 4H20v5.33h-5.33zM4 14.67h5.33V20H4zM14.67 14.67H20V20h-5.33z"/>
      </g>
      <g id="i-laser" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round">
        <circle cx="12" cy="12" r="3" fill="currentColor" stroke="none"/>
        <circle cx="12" cy="12" r="7.5"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3"/>
      </g>
      <g id="i-undo" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
        <path d="M5 10h10a4.5 4.5 0 0 1 0 9H9"/><path d="M8.5 6.5L5 10l3.5 3.5"/>
      </g>
      <g id="i-trash" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 7h16"/><path d="M9 7V4.5h6V7"/><path d="M6 7l.8 12.5h10.4L18 7"/><path d="M10 11v5M14 11v5"/>
      </g>
      <g id="i-board-white" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3.5" y="4.5" width="17" height="12" rx="1.5"/><path d="M9 20.5h6M12 16.5v4"/>
      </g>
      <g id="i-board-black" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3.5" y="4.5" width="17" height="12" rx="1.5" fill="currentColor"/><path d="M9 20.5h6M12 16.5v4"/>
      </g>
      <g id="i-pin" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
        <path d="M9 3h6l-1 6 3 3v2H7v-2l3-3-1-6z"/><path d="M12 14v7"/>
      </g>
      <g id="i-copy" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
        <rect x="9" y="9" width="11" height="11" rx="2"/><path d="M15 9V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v7a2 2 0 0 0 2 2h3"/>
      </g>
      <g id="i-save" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 5.5A1.5 1.5 0 0 1 5.5 4H16l4 4v10.5a1.5 1.5 0 0 1-1.5 1.5h-13A1.5 1.5 0 0 1 4 18.5z"/><path d="M8 4v5h7V4"/><path d="M8 20v-6h8v6"/>
      </g>
      <g id="i-close" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></g>
    </defs>
  </svg>
  <div id="tb">
    <div class="row">
      <span class="sw" data-c="#ef4444" style="background:#ef4444" title="빨강 (R)"></span>
      <span class="sw" data-c="#f97316" style="background:#f97316" title="주황 (O)"></span>
      <span class="sw" data-c="#eab308" style="background:#eab308" title="노랑 (Y)"></span>
      <span class="sw" data-c="#22c55e" style="background:#22c55e" title="초록 (G)"></span>
      <span class="sw" data-c="#3b82f6" style="background:#3b82f6" title="파랑 (B)"></span>
      <span class="sw" data-c="#ec4899" style="background:#ec4899" title="분홍 (P)"></span>
      <div class="sep"></div>
      <button class="tbtn" id="penMinus" title="펜 얇게 (Ctrl+휠 아래)"><svg viewBox="0 0 24 24"><use href="#i-minus"/></svg></button>
      <span id="penVal">5px</span>
      <button class="tbtn" id="penPlus" title="펜 굵게 (Ctrl+휠 위)"><svg viewBox="0 0 24 24"><use href="#i-plus"/></svg></button>
      <div class="sep"></div>
      <button class="tbtn" id="btnMosaic" data-act="mosaic" title="모자이크 — 켜고 드래그하면 그 부분을 가려요 (M)"><svg viewBox="0 0 24 24"><use href="#i-mosaic"/></svg></button>
      <button class="tbtn" id="btnLaser" data-act="laser" title="레이저 포인터 — 그으면 잠시 뒤 사라져요 (L)"><svg viewBox="0 0 24 24"><use href="#i-laser"/></svg></button>
      <div class="sep"></div>
      <button class="tbtn" data-act="undo" title="한 획 취소 (우클릭 / Ctrl+Z)"><svg viewBox="0 0 24 24"><use href="#i-undo"/></svg></button>
      <button class="tbtn" data-act="clear" title="모두 지우기 (E)"><svg viewBox="0 0 24 24"><use href="#i-trash"/></svg></button>
      <button class="tbtn" id="btnWhite" data-act="white" title="흰 칠판 모드 (W)"><svg viewBox="0 0 24 24"><use href="#i-board-white"/></svg></button>
      <button class="tbtn" id="btnBlack" data-act="black" title="검은 칠판 모드 (K)"><svg viewBox="0 0 24 24"><use href="#i-board-black"/></svg></button>
      <div class="sep"></div>
      <button class="tbtn" data-act="pin" title="지금 화면을 핀으로 붙이기 (Enter)"><svg viewBox="0 0 24 24"><use href="#i-pin"/></svg></button>
      <button class="tbtn" data-act="copy" title="복사 (Ctrl+C)"><svg viewBox="0 0 24 24"><use href="#i-copy"/></svg></button>
      <button class="tbtn" data-act="save" title="저장 (Ctrl+S)"><svg viewBox="0 0 24 24"><use href="#i-save"/></svg></button>
      <button class="tbtn" data-act="close" title="종료 (Esc)"><svg viewBox="0 0 24 24"><use href="#i-close"/></svg></button>
      <span id="zoomLabel">100%</span>
    </div>
    <div id="hint">드래그=펜 · Shift=직선 · Ctrl=사각형 · Ctrl+Shift=화살표 · Alt+클릭=①번호 · L=레이저 · F5=화면 갱신 · Esc=끝내기</div>
    <div id="hint2" style="display:none; color:#005fb8; text-align:center; font-size:12px">🔲 모자이크 켜짐 — 가릴 부분을 드래그하세요 (버튼을 다시 누르면 끄기)</div>
  </div>
  <div id="zhint">휠·↑↓ = 배율 &nbsp;·&nbsp; Ctrl+휠 = 더 크게 &nbsp;·&nbsp; 드래그 = 그리기 &nbsp;·&nbsp; F5 = 화면 갱신 &nbsp;·&nbsp; Esc·우클릭 = 끝내기</div>
  <div id="zbadge">200%</div>

<script src="i18n.js"></script>
<script>
  // ----- 다국어: OS 언어에 맞춰 표시 (ko는 원문 그대로) -----
  const LANG = (window.api && window.api.locale) || 'ko';
  const T = window.I18N ? I18N.translator(LANG) : ((s) => s);
  if (LANG !== 'ko' && window.I18N) I18N.applyPage(LANG, 'screen.html', document);


  const bgCanvas = document.getElementById('bg');
  const inkCanvas = document.getElementById('ink');
  // 배경은 늘 전체를 덮어 칠하므로 알파가 필요 없다 — 알파를 빼면 합성이 더 싸다
  const bg = bgCanvas.getContext('2d', { alpha: false });
  const ink = inkCanvas.getContext('2d');
  const zoomLabel = document.getElementById('zoomLabel');
  const penVal = document.getElementById('penVal');
  const toolbar = document.getElementById('tb');
  const zoomHint = document.getElementById('zhint');
  const zoomBadge = document.getElementById('zbadge');
  // 원본 스크린샷을 담는 오프스크린 캔버스 (원시 비트맵을 그려 넣는다)
  const img = document.createElement('canvas');

  let IW = 0, IH = 0;        // 스크린샷(=캔버스) 픽셀 크기
  let mode = 'draw';
  let isZoomMode = false;
  let color = '#ef4444';     // 기본 빨강 펜 (판서용)
  let penScreen = 5;         // 화면 기준 펜 굵기(px)
  let board = null;          // null | 'white' | 'black'
  const strokes = [];        // {type, color, width, points|x1..y2}
  let current = null;
  let drawing = false;
  let stepSeq = 0;           // 풀이 순서 번호 카운터
  let mosaicMode = false;    // 모자이크 도구 켜짐 여부
  let laserMode = false;     // 레이저 포인터 — 그으면 잠시 뒤 사라진다
  const laserStrokes = [];   // {color, width, points, doneAt}
  const LASER_FADE = 1300;   // 손을 뗀 뒤 사라지기까지 (ms)
  let tabHeld = false;
  let frozenOrigin = null;   // 그리는 동안 팬 고정

  const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));
  const R = () => IW / window.innerWidth; // 화면px → 이미지px 배율

  // ----- 배율·팬 상태 -----
  // z / anchor 는 "지금 보이는 값", targetZ / aim 은 "가야 할 값".
  // 매 프레임 시간에 비례해 목표로 다가가므로 60Hz든 120Hz든 같은 속도로 움직인다.
  let z = 1, targetZ = 1;
  let anchor = { x: 0, y: 0 };   // 화면좌표 기준 확대 중심 (지금)
  let aim = { x: 0, y: 0 };      // 확대 중심 (목표 = 마우스 위치)
  let smoothOn = true;           // 배경 보간 (배율이 확정될 때만 바꿔 깜박임을 막는다)
  let closeWhenZoomedOut = false;

  const TAU_IN = 0.075;   // 처음 1배 → 2배로 들어갈 때
  const TAU_WHEEL = 0.055; // 휠·방향키 반응 (짧을수록 즉각적)
  const TAU_OUT = 0.042;  // 축소하며 빠져나갈 때
  const TAU_PAN = 0.035;  // 마우스 따라 화면이 미끄러지는 속도
  let zoomTau = TAU_WHEEL;

  // 휠만 굴리면 8배까지. 더 봐야 할 때 Ctrl+휠로 그 위까지 파고든다.
  const Z_MAX = 8, Z_MAX_DEEP = 40;
  let maxZ = Z_MAX;

  window.api.onOverlayInit(({ shot, mode: m, cursor }) => {
    // 창을 재사용하므로 지난 판서·상태를 모두 지운다
    strokes.length = 0;
    current = null; drawing = false; stepSeq = 0;
    mosaicMode = false; board = null; tabHeld = false; frozenOrigin = null;
    laserMode = false; laserStrokes.length = 0;
    penScreen = 5; color = '#ef4444';
    z = targetZ = 1; smoothOn = true; closeWhenZoomedOut = false;
    zoomTau = TAU_WHEEL;
    maxZ = Z_MAX;
    // 창은 닫히지 않고 숨겨졌다 재사용된다 — 다시 보낼 수 있게 잠금을 푼다
    finished = false;
    toolbar.style.display = '';
    document.body.style.cursor = 'crosshair';
    zoomHint.style.opacity = '0';
    zoomBadge.style.opacity = '0';

    mode = m;
    isZoomMode = mode === 'zoom';
    // 확대를 시작한 순간의 마우스 위치를 중심으로 (ZoomIt과 동일)
    const start = cursor
      ? { x: cursor.x, y: cursor.y }
      : { x: window.innerWidth / 2, y: window.innerHeight / 2 };
    anchor = { x: start.x, y: start.y };
    aim = { x: start.x, y: start.y };

    if (isZoomMode) {
      // ZoomIt처럼: 도구모음 없는 깨끗한 화면, 보통 커서, 부드럽게 확대
      toolbar.style.display = 'none';
      document.body.style.cursor = 'default';
      zoomHint.style.opacity = '1';
      setTimeout(() => { zoomHint.style.opacity = '0'; }, 2600);
    }
    applyShot(shot);

    drawBG();
    drawInk();
    updateToolbar();
    // 그리기가 끝났으니 바로 알린다 (숨겨진 창에서는 rAF가 돌지 않는다).
    window.api.overlayPainted();

    // 창이 실제로 화면에 뜬 뒤에 1배 → 2배 애니메이션을 시작해야
    // 미끄러지듯 커지는 첫 장면이 눈에 보인다. 신호가 안 와도 곧 시작한다.
    pendingZoomIn = isZoomMode;
    setTimeout(startZoomIn, 220);
  });

  // 원시 비트맵(BGRA)을 그려 넣는다. PNG로 주고받으면 0.5초가 그냥 사라진다.
  function applyShot(shot) {
    const u = new Uint8ClampedArray(shot.bitmap.buffer || shot.bitmap);
    for (let i = 0; i < u.length; i += 4) { const b = u[i]; u[i] = u[i + 2]; u[i + 2] = b; }
    IW = shot.width; IH = shot.height;
    img.width = IW; img.height = IH;
    img.getContext('2d').putImageData(new ImageData(u, IW, IH), 0, 0);
    bgCanvas.width = IW; bgCanvas.height = IH;
    inkCanvas.width = IW; inkCanvas.height = IH;
  }

  // F5: 오버레이를 잠깐 내리고 화면을 새로 찍어, 배율·판서를 유지한 채 배경만 바꾼다
  if (window.api.onOverlayRefresh) {
    window.api.onOverlayRefresh(({ shot }) => {
      applyShot(shot);
      refresh(true);
    });
  }

  let pendingZoomIn = false;
  function startZoomIn() {
    if (!pendingZoomIn) return;
    pendingZoomIn = false;
    zoomTau = TAU_IN;
    setTargetZ(2);
  }
  if (window.api.onOverlayShown) window.api.onOverlayShown(startZoomIn);

  // ----- 부드러운 배율·팬 애니메이션 (ZoomIt 느낌) -----

  function setTargetZ(t, thenClose) {
    targetZ = clamp(t, 1, maxZ);
    // 배율이 확정된 시점에 한 번만 정한다 — 애니메이션 도중에 바뀌면 화면이 튄다
    smoothOn = targetZ < 2.5;
    if (thenClose) { closeWhenZoomedOut = true; zoomTau = TAU_OUT; }
    kick();
  }

  let running = false, prevT = 0;
  let needBG = false, needInk = false;

  // 배경까지 다시 그려야 하면 bg=true
  function refresh(bgToo) {
    if (bgToo) needBG = true;
    needInk = true;
    kick();
  }

  function kick() {
    if (running) return;
    running = true; prevT = 0;
    requestAnimationFrame(tick);
  }

  function tick(t) {
    const dt = prevT ? Math.min(0.05, (t - prevT) / 1000) : 1 / 60;
    prevT = t;
    let moving = false;

    // 배율
    const dz = targetZ - z;
    if (Math.abs(dz) > 0.004) {
      z += dz * (1 - Math.exp(-dt / zoomTau));
      moving = true; needBG = needInk = true;
    } else if (z !== targetZ) {
      z = targetZ; needBG = needInk = true;
    }

    // 팬 (확대 상태에서만 의미가 있다. 그리는 중에는 화면을 고정)
    if (frozenOrigin || (z <= 1.001 && targetZ <= 1.001)) {
      anchor.x = aim.x; anchor.y = aim.y;
    } else {
      const dx = aim.x - anchor.x, dy = aim.y - anchor.y;
      if (Math.abs(dx) > 0.15 || Math.abs(dy) > 0.15) {
        const k = 1 - Math.exp(-dt / TAU_PAN);
        anchor.x += dx * k; anchor.y += dy * k;
        moving = true; needBG = needInk = true;
      } else if (anchor.x !== aim.x || anchor.y !== aim.y) {
        anchor.x = aim.x; anchor.y = aim.y;
        needBG = needInk = true;
      }
    }

    if (needBG) drawBG();
    if (needInk) drawInk();
    if (needBG || needInk) updateToolbar();
    needBG = needInk = false;

    if (moving) { requestAnimationFrame(tick); return; }
    running = false;
    zoomTau = closeWhenZoomedOut ? TAU_OUT : TAU_WHEEL;
    if (closeWhenZoomedOut && targetZ === 1) finish('close');
  }

  // 현재 보이는 영역의 원점(이미지 좌표)
  function origin() {
    if (frozenOrigin) return frozenOrigin;
    const fx = clamp(anchor.x / window.innerWidth, 0, 1);
    const fy = clamp(anchor.y / window.innerHeight, 0, 1);
    return { x: (IW - IW / z) * fx, y: (IH - IH / z) * fy };
  }

  // 화면 좌표 → 이미지 좌표
  function toImage(cx, cy) {
    const o = origin();
    return {
      x: o.x + (cx / window.innerWidth) * (IW / z),
      y: o.y + (cy / window.innerHeight) * (IH / z),
    };
  }

  // ----- 그리기 -----

  // 펜 획을 부드러운 곡선으로 (점을 그대로 이으면 각져 보인다)
  function penPath(c, pts) {
    if (pts.length === 1) {
      c.beginPath();
      c.arc(pts[0].x, pts[0].y, c.lineWidth / 2, 0, Math.PI * 2);
      c.fill();
      return;
    }
    c.beginPath();
    c.moveTo(pts[0].x, pts[0].y);
    if (pts.length === 2) c.lineTo(pts[1].x, pts[1].y);
    else {
      for (let i = 1; i < pts.length - 1; i++) {
        c.quadraticCurveTo(pts[i].x, pts[i].y,
          (pts[i].x + pts[i + 1].x) / 2, (pts[i].y + pts[i + 1].y) / 2);
      }
      const last = pts[pts.length - 1];
      c.lineTo(last.x, last.y);
    }
    c.stroke();
  }

  function drawStroke(c, s) {
    c.strokeStyle = s.color;
    c.fillStyle = s.color;
    c.lineWidth = s.width;
    c.lineCap = 'round';
    c.lineJoin = 'round';
    if (s.type === 'pen') {
      penPath(c, s.points);
    } else if (s.type === 'line') {
      c.beginPath();
      c.moveTo(s.x1, s.y1); c.lineTo(s.x2, s.y2);
      c.stroke();
    } else if (s.type === 'rect') {
      c.strokeRect(Math.min(s.x1, s.x2), Math.min(s.y1, s.y2),
        Math.abs(s.x2 - s.x1), Math.abs(s.y2 - s.y1));
    } else if (s.type === 'ellipse') {
      c.beginPath();
      c.ellipse((s.x1 + s.x2) / 2, (s.y1 + s.y2) / 2,
        Math.abs(s.x2 - s.x1) / 2, Math.abs(s.y2 - s.y1) / 2, 0, 0, Math.PI * 2);
      c.stroke();
    } else if (s.type === 'arrow') {
      const ang = Math.atan2(s.y2 - s.y1, s.x2 - s.x1);
      const head = Math.max(s.width * 3.2, 14);
      c.beginPath();
      c.moveTo(s.x1, s.y1); c.lineTo(s.x2, s.y2);
      c.stroke();
      c.beginPath();
      c.moveTo(s.x2, s.y2);
      c.lineTo(s.x2 - head * Math.cos(ang - 0.45), s.y2 - head * Math.sin(ang - 0.45));
      c.lineTo(s.x2 - head * Math.cos(ang + 0.45), s.y2 - head * Math.sin(ang + 0.45));
      c.closePath();
      c.fill();
    } else if (s.type === 'mosaic') {
      // 원본 이미지를 굵은 격자로 다시 그려 모자이크 효과
      const x = Math.min(s.x1, s.x2), y = Math.min(s.y1, s.y2);
      const w = Math.abs(s.x2 - s.x1), h = Math.abs(s.y2 - s.y1);
      if (w < 2 || h < 2) return;
      const cell = Math.max(6, Math.round(Math.min(w, h) / 9));
      c.save();
      c.beginPath();
      c.rect(x, y, w, h);
      c.clip();
      if (board) {
        // 칠판 모드에서는 색 정보가 없으니 단색으로 덮음
        c.fillStyle = board === 'white' ? '#cbd5e1' : '#334155';
        c.fillRect(x, y, w, h);
      } else {
        c.imageSmoothingEnabled = false;
        for (let gy = y; gy < y + h; gy += cell) {
          for (let gx = x; gx < x + w; gx += cell) {
            // 각 격자의 좌상단 1픽셀을 격자 전체로 확대
            c.drawImage(img, Math.round(gx), Math.round(gy), 1, 1,
              Math.round(gx), Math.round(gy), cell, cell);
          }
        }
        c.imageSmoothingEnabled = true;
      }
      c.restore();
    } else if (s.type === 'step') {
      // 풀이 순서 번호 ①②③
      c.beginPath();
      c.arc(s.x, s.y, s.r, 0, Math.PI * 2);
      c.fill();
      c.fillStyle = '#ffffff';
      c.font = `700 ${Math.round(s.r * 1.15)}px 'Malgun Gothic', sans-serif`;
      c.textAlign = 'center';
      c.textBaseline = 'middle';
      c.fillText(String(s.n), s.x, s.y + s.r * 0.06);
    }
  }

  // 배경: 전체 이미지를 변환하지 않고 "보이는 부분만" 잘라서 확대한다.
  // 3456x2234 전체를 매 프레임 변환하면 확대 중에 눈에 띄게 끊긴다.
  function drawBG() {
    if (!IW) return;
    bg.setTransform(1, 0, 0, 1, 0, 0);
    if (board === 'white') { bg.fillStyle = '#f8fafc'; bg.fillRect(0, 0, IW, IH); return; }
    if (board === 'black') { bg.fillStyle = '#0f172a'; bg.fillRect(0, 0, IW, IH); return; }
    const o = origin();
    bg.imageSmoothingEnabled = smoothOn;  // 많이 확대하면 픽셀을 또렷하게
    bg.drawImage(img, o.x, o.y, IW / z, IH / z, 0, 0, IW, IH);
  }

  function inkTransform() {
    const o = origin();
    ink.setTransform(z, 0, 0, z, -o.x * z, -o.y * z);
  }

  function drawInk() {
    if (!IW) return;
    ink.setTransform(1, 0, 0, 1, 0, 0);
    ink.clearRect(0, 0, IW, IH);
    if (!strokes.length && !current && !laserStrokes.length) return;
    inkTransform();
    for (const s of strokes) drawStroke(ink, s);
    if (current && current.type !== 'laser') drawStroke(ink, current);
    // 레이저: 굵고 옅은 밑칠 + 진한 심 — 손을 뗀 뒤 서서히 사라진다
    const now = performance.now();
    for (const s of laserStrokes) drawLaser(s, 1 - (now - s.doneAt) / LASER_FADE);
    if (current && current.type === 'laser') drawLaser(current, 1);
  }

  function drawLaser(s, alpha) {
    if (alpha <= 0) return;
    ink.save();
    ink.strokeStyle = s.color;
    ink.fillStyle = s.color;
    ink.lineCap = 'round';
    ink.lineJoin = 'round';
    ink.globalAlpha = alpha * 0.25;
    ink.lineWidth = s.width * 2.6;
    penPath(ink, s.points);
    ink.globalAlpha = alpha;
    ink.lineWidth = s.width;
    penPath(ink, s.points);
    ink.restore();
  }

  // 사라지는 동안만 도는 페이드 루프
  let laserAnim = false;
  function kickLaser() {
    if (laserAnim) return;
    laserAnim = true;
    requestAnimationFrame(function fade() {
      const now = performance.now();
      for (let i = laserStrokes.length - 1; i >= 0; i--) {
        if (now - laserStrokes[i].doneAt > LASER_FADE) laserStrokes.splice(i, 1);
      }
      drawInk();
      if (laserStrokes.length) requestAnimationFrame(fade);
      else laserAnim = false;
    });
  }

  // 펜은 방금 늘어난 꼬리만 덧그린다 — 지우고 전부 다시 그리지 않으므로
  // 획이 길어져도 손을 그대로 따라온다.
  function drawPenTail(s) {
    const pts = s.points;
    if (pts.length < 2) return;
    inkTransform();
    ink.strokeStyle = s.color;
    ink.lineWidth = s.width;
    ink.lineCap = 'round';
    ink.lineJoin = 'round';
    ink.beginPath();
    if (pts.length === 2) {
      ink.moveTo(pts[0].x, pts[0].y);
      ink.lineTo(pts[1].x, pts[1].y);
    } else {
      const a = pts[pts.length - 3], b = pts[pts.length - 2], d = pts[pts.length - 1];
      ink.moveTo((a.x + b.x) / 2, (a.y + b.y) / 2);
      ink.quadraticCurveTo(b.x, b.y, (b.x + d.x) / 2, (b.y + d.y) / 2);
    }
    ink.stroke();
  }

  // 도구모음은 값이 바뀔 때만 손댄다 (매 프레임 DOM을 건드리면 그만큼 느려진다)
  let uiZ = -1, uiPen = -1, uiColor = '', uiBoard = '_', uiMosaic = null, uiLaser = null;
  function updateToolbar() {
    if (isZoomMode) return;
    const pz = Math.round(z * 100);
    if (pz !== uiZ) { zoomLabel.textContent = `${pz}%`; uiZ = pz; }
    if (penScreen !== uiPen) { penVal.textContent = `${penScreen}px`; uiPen = penScreen; }
    if (color !== uiColor) {
      uiColor = color;
      for (const sw of document.querySelectorAll('.sw')) {
        sw.classList.toggle('on', sw.dataset.c === color);
      }
    }
    if (board !== uiBoard) {
      uiBoard = board;
      document.getElementById('btnWhite').classList.toggle('on', board === 'white');
      document.getElementById('btnBlack').classList.toggle('on', board === 'black');
    }
    if (mosaicMode !== uiMosaic) {
      uiMosaic = mosaicMode;
      document.getElementById('btnMosaic').classList.toggle('on', mosaicMode);
      document.getElementById('hint').style.display = mosaicMode ? 'none' : '';
      document.getElementById('hint2').style.display = mosaicMode ? '' : 'none';
    }
    if (laserMode !== uiLaser) {
      uiLaser = laserMode;
      document.getElementById('btnLaser').classList.toggle('on', laserMode);
    }
  }

  // 모자이크와 레이저는 동시에 켤 수 없다
  function toggleMosaic() { mosaicMode = !mosaicMode; if (mosaicMode) laserMode = false; updateToolbar(); }
  function toggleLaser() { laserMode = !laserMode; if (laserMode) mosaicMode = false; updateToolbar(); }

  // ----- 마우스 -----

  window.addEventListener('mousedown', (e) => {
    if (e.target.closest && e.target.closest('#tb')) return; // 도구모음 위에서는 그리지 않음
    if (e.button === 2) return; // 우클릭은 undo (contextmenu에서)
    if (e.button !== 0) return;
    if (e.altKey) {
      // Alt+클릭 = 풀이 순서 번호 ①②③ 찍기
      const p = toImage(e.clientX, e.clientY);
      const r = (Math.max(14, penScreen * 2.6) * R()) / z;
      strokes.push({ type: 'step', x: p.x, y: p.y, r, n: ++stepSeq, color });
      refresh(false);
      return;
    }
    drawing = true;
    // 그리는 동안 화면 고정 — 손이 흔들려도 배경이 따라 움직이지 않는다.
    // 지금 눈에 보이는 위치(anchor) 그대로 얼려야 누른 지점이 밀리지 않는다.
    frozenOrigin = origin();
    const p = toImage(e.clientX, e.clientY);
    const width = (penScreen * R()) / z;
    if (laserMode) current = { type: 'laser', color, width: (Math.max(penScreen, 6) * R()) / z, points: [p] };
    else if (mosaicMode) current = { type: 'mosaic', color, width, x1: p.x, y1: p.y, x2: p.x, y2: p.y };
    else if (tabHeld) current = { type: 'ellipse', color, width, x1: p.x, y1: p.y, x2: p.x, y2: p.y };
    else if (e.ctrlKey && e.shiftKey) current = { type: 'arrow', color, width, x1: p.x, y1: p.y, x2: p.x, y2: p.y };
    else if (e.shiftKey) current = { type: 'line', color, width, x1: p.x, y1: p.y, x2: p.x, y2: p.y };
    else if (e.ctrlKey) current = { type: 'rect', color, width, x1: p.x, y1: p.y, x2: p.x, y2: p.y };
    else current = { type: 'pen', color, width, points: [p] };
    refresh(false);
  });

  window.addEventListener('mousemove', (e) => {
    if (drawing && current) {
      const p = toImage(e.clientX, e.clientY);
      if (current.type === 'pen' || current.type === 'laser') {
        const pts = current.points;
        const last = pts[pts.length - 1];
        // 손 떨림 수준의 점은 버린다 (곡선이 매끈해지고 그릴 양도 준다)
        const minStep = Math.max(0.8, current.width * 0.25);
        if (Math.abs(p.x - last.x) + Math.abs(p.y - last.y) < minStep) return;
        pts.push(p);
        // 레이저는 밑칠이 겹치면 얼룩져서 매번 전체를 다시 그린다 (짧아서 싸다)
        if (current.type === 'laser') refresh(false);
        else drawPenTail(current);   // 꼬리만 덧그리기 — 전체 다시 그리기 없음
      } else {
        current.x2 = p.x; current.y2 = p.y;
        refresh(false);
      }
      return;
    }
    // 도구모음 위에서는 화면 이동(팬)을 멈춰 조작이 편하게
    if (e.target.closest && e.target.closest('#tb')) return;
    aim = { x: e.clientX, y: e.clientY };
    if (z > 1.001 || targetZ > 1.001) kick();
  });

  window.addEventListener('mouseup', (e) => {
    if (e.button !== 0 || !drawing) return;
    drawing = false;
    if (current && current.type === 'laser') {
      // 레이저는 획으로 남기지 않고 잠시 뒤 사라진다 (내보내기·undo에서도 제외)
      current.doneAt = performance.now();
      laserStrokes.push(current);
      kickLaser();
    } else if (current) {
      strokes.push(current);
    }
    current = null;
    frozenOrigin = null;
    refresh(true);
  });

  // 휠 한 칸과 트랙패드 스크롤은 값의 단위가 전혀 다르다.
  // 그대로 "한 번에 1.35배"로 처리하면 트랙패드에서 한 번 밀 때
  // 이벤트가 수십 개 날아와 순식간에 최대 배율까지 튄다.
  function wheelAmount(e) {
    const unit = e.deltaMode === 1 ? 16 : e.deltaMode === 2 ? window.innerHeight : 1;
    return clamp(e.deltaY * unit, -140, 140);
  }

  window.addEventListener('wheel', (e) => {
    e.preventDefault();
    const deep = e.ctrlKey || e.metaKey;
    // 판서 모드에서 Ctrl+휠은 예전 그대로 펜 굵기
    if (deep && !isZoomMode) {
      penScreen = clamp(penScreen + (e.deltaY < 0 ? 1 : -1), 2, 30);
      refresh(false);
      return;
    }
    if (drawing) return;
    // 확대 모드에서 Ctrl을 누른 채 굴리면 8배 한계를 풀고 더 깊이 들어간다.
    // 한 번 풀면 그대로 두어야 Ctrl에서 손을 뗀 순간 배율이 도로 튕기지 않는다.
    if (deep) maxZ = Z_MAX_DEEP;
    zoomTau = TAU_WHEEL;
    setTargetZ(targetZ * Math.exp(-wheelAmount(e) * (deep ? 0.0042 : 0.0024)));
    flashZoomBadge();
  }, { passive: false });

  // 확대 모드에는 도구모음이 없으니 배율을 잠깐 띄워 보여준다
  let badgeTimer = 0;
  function flashZoomBadge() {
    if (!isZoomMode) return;
    zoomBadge.textContent = `${Math.round(targetZ * 100)}%`;
    zoomBadge.style.opacity = '1';
    clearTimeout(badgeTimer);
    badgeTimer = setTimeout(() => { zoomBadge.style.opacity = '0'; }, 900);
  }

  function undo() {
    const s = strokes.pop();
    if (s && s.type === 'step') stepSeq = Math.max(0, stepSeq - 1);
    refresh(true);
  }

  // 우클릭: 확대 모드에서는 ZoomIt처럼 부드럽게 축소하며 종료,
  //         판서 모드에서는 마지막 획 취소
  window.addEventListener('contextmenu', (e) => {
    e.preventDefault();
    if (e.target.closest && e.target.closest('#tb')) return;
    if (isZoomMode) { setTargetZ(1, true); return; }
    undo();
  });

  // ----- 내보내기 -----

  function exportVisible() {
    const o = origin();
    const w = Math.round(IW / z), h = Math.round(IH / z);
    const c = document.createElement('canvas');
    c.width = w; c.height = h;
    const cc = c.getContext('2d');
    cc.translate(-o.x, -o.y);
    // 배경
    if (board === 'white') { cc.fillStyle = '#f8fafc'; cc.fillRect(0, 0, IW, IH); }
    else if (board === 'black') { cc.fillStyle = '#0f172a'; cc.fillRect(0, 0, IW, IH); }
    else cc.drawImage(img, 0, 0);
    // 획 (내보내기용 임시 컨텍스트에 다시 그림)
    for (const s of strokes) drawStroke(cc, s);
    return { dataURL: c.toDataURL('image/png'), w, h };
  }

  // ----- 공통 동작 -----

  // 복사는 창을 열어둔 채로 진행되므로 잠그지 않는다.
  // 나머지(닫기·핀·저장)는 창이 사라지므로 연타로 두 번 보내지 않게 막는다.
  let finished = false;
  function finish(action) {
    if (finished) return;
    if (action !== 'copy') finished = true;
    if (action === 'close') { window.api.overlayFinish({ action: 'close' }); return; }
    const { dataURL, w, h } = exportVisible();
    window.api.overlayFinish({ action, dataURL, w, h });
  }

  function clearAll() { strokes.length = 0; stepSeq = 0; current = null; refresh(true); }
  function toggleBoard(kind) { board = board === kind ? null : kind; refresh(true); }

  // ----- 도구모음 (마우스 조작) -----

  for (const sw of document.querySelectorAll('.sw')) {
    sw.addEventListener('click', () => { color = sw.dataset.c; updateToolbar(); });
  }
  document.getElementById('penMinus').addEventListener('click', () => {
    penScreen = clamp(penScreen - 1, 2, 30); updateToolbar();
  });
  document.getElementById('penPlus').addEventListener('click', () => {
    penScreen = clamp(penScreen + 1, 2, 30); updateToolbar();
  });
  for (const btn of document.querySelectorAll('.tbtn[data-act]')) {
    btn.addEventListener('click', () => {
      const act = btn.dataset.act;
      if (act === 'undo') undo();
      else if (act === 'clear') clearAll();
      else if (act === 'mosaic') toggleMosaic();
      else if (act === 'laser') toggleLaser();
      else if (act === 'white') toggleBoard('white');
      else if (act === 'black') toggleBoard('black');
      else finish(act); // pin / copy / save / close
    });
  }

  // ----- 키보드 -----

  const COLOR_KEYS = {
    r: '#ef4444', g: '#22c55e', b: '#3b82f6',
    o: '#f97316', y: '#eab308', p: '#ec4899',
  };

  function zoomStep(inward, deep) {
    if (drawing) return;
    if (deep) maxZ = Z_MAX_DEEP;
    const step = deep ? 1.8 : 1.3;
    zoomTau = TAU_WHEEL;
    setTargetZ(inward ? targetZ * step : targetZ / step);
    flashZoomBadge();
  }

  window.addEventListener('keydown', (e) => {
    if (e.key === 'Tab') { e.preventDefault(); tabHeld = true; return; }
    // Esc = 모드 취소. 그리던 중이든 아니든 언제나 바로 빠져나간다.
    // (메인 프로세스도 Esc를 가로채 같은 동작을 하므로 둘이 어긋나면 안 된다)
    if (e.key === 'Escape') {
      e.preventDefault();
      drawing = false; current = null; frozenOrigin = null;
      finish('close');
      return;
    }
    // ZoomIt처럼 방향키·+·−로도 배율 조절
    // Ctrl을 같이 누르면 휠과 마찬가지로 8배 위로도 들어간다
    const deep = e.ctrlKey || e.metaKey;
    if (e.key === 'ArrowUp' || e.key === '+' || e.key === '=') { e.preventDefault(); zoomStep(true, deep); return; }
    if (e.key === 'ArrowDown' || e.key === '-' || e.key === '_') { e.preventDefault(); zoomStep(false, deep); return; }
    if (e.key === 'F5') { e.preventDefault(); if (!drawing) window.api.overlayRefresh(); return; }
    if (e.key === 'Enter') { finish('pin'); return; }
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z') { undo(); return; }
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'c') { finish('copy'); return; }
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's') { e.preventDefault(); finish('save'); return; }
    const k = e.key.toLowerCase();
    if (k === 'e') { clearAll(); return; }
    if (k === 'm') { toggleMosaic(); return; }
    if (k === 'l') { toggleLaser(); return; }
    if (k === 'w') { toggleBoard('white'); return; }
    if (k === 'k') { toggleBoard('black'); return; }
    if (COLOR_KEYS[k] && !e.ctrlKey && !e.metaKey) { color = COLOR_KEYS[k]; updateToolbar(); return; }
  });

  window.addEventListener('keyup', (e) => {
    if (e.key === 'Tab') tabHeld = false;
  });
</script>
</body>
</html>
