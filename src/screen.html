<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; user-select: none; background: #000; cursor: crosshair; }
  #canvas { width: 100vw; height: 100vh; display: block; }
  #tb {
    position: absolute; bottom: 14px; left: 50%; transform: translateX(-50%);
    background: rgba(15, 23, 42, .93);
    border: 1px solid rgba(148, 163, 184, .4);
    border-radius: 14px;
    padding: 8px 12px 6px;
    display: flex; flex-direction: column; gap: 4px;
    font: 12px 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif;
    color: #cbd5e1; cursor: default; white-space: nowrap;
  }
  #tb .row { display: flex; align-items: center; gap: 5px; }
  .sw {
    width: 20px; height: 20px; border-radius: 50%;
    border: 2px solid rgba(255, 255, 255, .25); cursor: pointer;
  }
  .sw.on { border-color: #fff; box-shadow: 0 0 0 2px rgba(255,255,255,.35); }
  .tbtn {
    min-width: 30px; height: 28px; padding: 0 7px;
    border: 0; border-radius: 8px;
    background: transparent; color: #e2e8f0;
    font: 14px 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
  }
  .tbtn:hover { background: rgba(148, 163, 184, .25); }
  .tbtn.on { background: rgba(59, 130, 246, .55); }
  .sep { width: 1px; height: 20px; background: rgba(148, 163, 184, .35); margin: 0 3px; }
  #penVal { min-width: 36px; text-align: center; color: #f1f5f9; }
  #zoomLabel { margin-left: 4px; color: #94a3b8; min-width: 42px; }
  #hint { text-align: center; color: #64748b; font-size: 11px; }

  /* 확대 모드 첫 안내 — 잠깐 보였다가 사라진다 */
  #zhint {
    position: absolute; top: 26px; left: 50%; transform: translateX(-50%);
    background: rgba(15, 23, 42, .85); color: #cbd5e1;
    font: 13px 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif;
    padding: 8px 18px; border-radius: 20px;
    pointer-events: none; opacity: 0; transition: opacity .5s;
  }
</style>
</head>
<body>
  <canvas id="canvas"></canvas>
  <div id="tb">
    <div class="row">
      <span class="sw" data-c="#ef4444" style="background:#ef4444" title="빨강 (R)"></span>
      <span class="sw" data-c="#f97316" style="background:#f97316" title="주황 (O)"></span>
      <span class="sw" data-c="#eab308" style="background:#eab308" title="노랑 (Y)"></span>
      <span class="sw" data-c="#22c55e" style="background:#22c55e" title="초록 (G)"></span>
      <span class="sw" data-c="#3b82f6" style="background:#3b82f6" title="파랑 (B)"></span>
      <span class="sw" data-c="#ec4899" style="background:#ec4899" title="분홍 (P)"></span>
      <div class="sep"></div>
      <button class="tbtn" id="penMinus" title="펜 얇게 (Ctrl+휠 아래)">−</button>
      <span id="penVal">5px</span>
      <button class="tbtn" id="penPlus" title="펜 굵게 (Ctrl+휠 위)">＋</button>
      <div class="sep"></div>
      <button class="tbtn" id="btnMosaic" data-act="mosaic" title="모자이크 — 켜고 드래그하면 그 부분을 가립니다 (M)">🔲</button>
      <div class="sep"></div>
      <button class="tbtn" data-act="undo" title="한 획 취소 (우클릭 / Ctrl+Z)">↩</button>
      <button class="tbtn" data-act="clear" title="모두 지우기 (E)">🗑</button>
      <button class="tbtn" id="btnWhite" data-act="white" title="흰 칠판 모드 (W)">⬜</button>
      <button class="tbtn" id="btnBlack" data-act="black" title="검은 칠판 모드 (K)">⬛</button>
      <div class="sep"></div>
      <button class="tbtn" data-act="pin" title="지금 화면을 핀으로 붙이기 (Enter)">📌</button>
      <button class="tbtn" data-act="copy" title="복사 (Ctrl+C)">📋</button>
      <button class="tbtn" data-act="save" title="저장 (Ctrl+S)">💾</button>
      <button class="tbtn" data-act="close" title="종료 (Esc)">✕</button>
      <span id="zoomLabel">100%</span>
    </div>
    <div id="hint">드래그=펜 · Shift=직선 · Ctrl=사각형 · Ctrl+Shift=화살표 · Tab+드래그=원 · Alt+클릭=①번호 · 휠=확대/축소</div>
    <div id="hint2" style="display:none; color:#93c5fd">🔲 모자이크 켜짐 — 가릴 부분을 드래그하세요 (버튼을 다시 누르면 끄기)</div>
  </div>
  <div id="zhint">휠·↑↓ = 배율 &nbsp;·&nbsp; 드래그 = 그리기 &nbsp;·&nbsp; 우클릭·Esc = 닫기</div>

<script>
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');
  const zoomLabel = document.getElementById('zoomLabel');
  const penVal = document.getElementById('penVal');
  const toolbar = document.getElementById('tb');
  // 원본 스크린샷을 담는 오프스크린 캔버스 (원시 비트맵을 그려 넣는다)
  const img = document.createElement('canvas');

  let z = 1;                 // 확대 배율 (1~8)
  let mode = 'draw';
  let color = '#ef4444';     // 기본 빨강 펜 (판서용)
  let penScreen = 5;         // 화면 기준 펜 굵기(px)
  let board = null;          // null | 'white' | 'black'
  const strokes = [];        // {type, color, width, points|x1..y2}
  let current = null;
  let drawing = false;
  let stepSeq = 0;           // 풀이 순서 번호 카운터
  let mosaicMode = false;    // 모자이크 도구 켜짐 여부
  let tabHeld = false;
  let lastMouse = { x: 0, y: 0 };
  let frozenOrigin = null;   // 그리는 동안 팬 고정

  const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));
  const R = () => img.width / window.innerWidth; // 화면px → 이미지px 배율

  const zoomHint = document.getElementById('zhint');
  let isZoomMode = false;

  window.api.onOverlayInit(({ shot, mode: m, cursor }) => {
    // 창을 재사용하므로 지난 판서·상태를 모두 지운다
    strokes.length = 0;
    current = null; drawing = false; stepSeq = 0;
    mosaicMode = false; board = null; tabHeld = false; frozenOrigin = null;
    penScreen = 5; color = '#ef4444';
    targetZ = 1; closeWhenZoomedOut = false;
    toolbar.style.display = '';
    document.body.style.cursor = 'crosshair';
    zoomHint.style.opacity = '0';

    mode = m;
    isZoomMode = mode === 'zoom';
    // 확대를 시작한 순간의 마우스 위치를 중심으로 (ZoomIt과 동일)
    if (cursor) lastMouse = { x: cursor.x, y: cursor.y };
    if (isZoomMode) {
      // ZoomIt처럼: 도구모음 없는 깨끗한 화면, 보통 커서, 부드럽게 확대
      toolbar.style.display = 'none';
      document.body.style.cursor = 'default';
      zoomHint.style.opacity = '1';
      setTimeout(() => { zoomHint.style.opacity = '0'; }, 2600);
    }
    // 원시 비트맵(BGRA)을 그려 넣는다. PNG로 주고받으면 0.5초가 그냥 사라진다.
    const u = new Uint8ClampedArray(shot.bitmap.buffer || shot.bitmap);
    for (let i = 0; i < u.length; i += 4) { const b = u[i]; u[i] = u[i + 2]; u[i + 2] = b; }
    img.width = shot.width; img.height = shot.height;
    img.getContext('2d').putImageData(new ImageData(u, shot.width, shot.height), 0, 0);
    canvas.width = img.width;
    canvas.height = img.height;
    z = 1;
    render();
    // 그리기가 끝났으니 바로 알린다 (숨겨진 창에서는 rAF가 돌지 않는다).
    // 창이 뜬 뒤 1배 → 2배로 미끄러지듯 확대해야 시작이 매끄럽다.
    window.api.overlayPainted();
    if (isZoomMode) setTimeout(() => setTargetZ(2), 16);
  });

  // ----- 부드러운 배율 애니메이션 (ZoomIt 느낌) -----

  let targetZ = 1;
  let zAnimating = false;
  let closeWhenZoomedOut = false;

  function setTargetZ(t, thenClose) {
    targetZ = clamp(t, 1, 8);
    if (thenClose) closeWhenZoomedOut = true;
    if (!zAnimating) { zAnimating = true; requestAnimationFrame(zTick); }
  }

  function zTick() {
    const diff = targetZ - z;
    if (Math.abs(diff) < 0.01) {
      z = targetZ;
      if (z < 1.05) z = targetZ = 1;
      zAnimating = false;
      render();
      if (closeWhenZoomedOut && targetZ === 1) finish('close');
      return;
    }
    z += diff * 0.28;
    render();          // 애니메이션 프레임 안이므로 바로 그린다
    requestAnimationFrame(zTick);
  }

  // 현재 보이는 영역의 원점(이미지 좌표)
  function origin() {
    if (frozenOrigin) return frozenOrigin;
    const fx = clamp(lastMouse.x / window.innerWidth, 0, 1);
    const fy = clamp(lastMouse.y / window.innerHeight, 0, 1);
    return {
      x: (canvas.width - canvas.width / z) * fx,
      y: (canvas.height - canvas.height / z) * fy,
    };
  }

  // 화면 좌표 → 이미지 좌표
  function toImage(cx, cy) {
    const o = origin();
    return {
      x: o.x + (cx / window.innerWidth) * (canvas.width / z),
      y: o.y + (cy / window.innerHeight) * (canvas.height / z),
    };
  }

  function drawStroke(c, s) {
    c.strokeStyle = s.color;
    c.fillStyle = s.color;
    c.lineWidth = s.width;
    c.lineCap = 'round';
    c.lineJoin = 'round';
    if (s.type === 'pen') {
      if (s.points.length < 2) {
        c.beginPath();
        c.arc(s.points[0].x, s.points[0].y, s.width / 2, 0, Math.PI * 2);
        c.fill();
        return;
      }
      c.beginPath();
      c.moveTo(s.points[0].x, s.points[0].y);
      for (const p of s.points) c.lineTo(p.x, p.y);
      c.stroke();
    } else if (s.type === 'line') {
      c.beginPath();
      c.moveTo(s.x1, s.y1); c.lineTo(s.x2, s.y2);
      c.stroke();
    } else if (s.type === 'rect') {
      c.strokeRect(Math.min(s.x1, s.x2), Math.min(s.y1, s.y2),
        Math.abs(s.x2 - s.x1), Math.abs(s.y2 - s.y1));
    } else if (s.type === 'ellipse') {
      c.beginPath();
      c.ellipse((s.x1 + s.x2) / 2, (s.y1 + s.y2) / 2,
        Math.abs(s.x2 - s.x1) / 2, Math.abs(s.y2 - s.y1) / 2, 0, 0, Math.PI * 2);
      c.stroke();
    } else if (s.type === 'arrow') {
      const ang = Math.atan2(s.y2 - s.y1, s.x2 - s.x1);
      const head = Math.max(s.width * 3.2, 14);
      c.beginPath();
      c.moveTo(s.x1, s.y1); c.lineTo(s.x2, s.y2);
      c.stroke();
      c.beginPath();
      c.moveTo(s.x2, s.y2);
      c.lineTo(s.x2 - head * Math.cos(ang - 0.45), s.y2 - head * Math.sin(ang - 0.45));
      c.lineTo(s.x2 - head * Math.cos(ang + 0.45), s.y2 - head * Math.sin(ang + 0.45));
      c.closePath();
      c.fill();
    } else if (s.type === 'mosaic') {
      // 원본 이미지를 굵은 격자로 다시 그려 모자이크 효과
      const x = Math.min(s.x1, s.x2), y = Math.min(s.y1, s.y2);
      const w = Math.abs(s.x2 - s.x1), h = Math.abs(s.y2 - s.y1);
      if (w < 2 || h < 2) return;
      const cell = Math.max(6, Math.round(Math.min(w, h) / 9));
      c.save();
      c.beginPath();
      c.rect(x, y, w, h);
      c.clip();
      if (board) {
        // 칠판 모드에서는 색 정보가 없으니 단색으로 덮음
        c.fillStyle = board === 'white' ? '#cbd5e1' : '#334155';
        c.fillRect(x, y, w, h);
      } else {
        c.imageSmoothingEnabled = false;
        for (let gy = y; gy < y + h; gy += cell) {
          for (let gx = x; gx < x + w; gx += cell) {
            // 각 격자의 좌상단 1픽셀을 격자 전체로 확대
            c.drawImage(img, Math.round(gx), Math.round(gy), 1, 1,
              Math.round(gx), Math.round(gy), cell, cell);
          }
        }
        c.imageSmoothingEnabled = true;
      }
      c.restore();
    } else if (s.type === 'step') {
      // 풀이 순서 번호 ①②③
      c.beginPath();
      c.arc(s.x, s.y, s.r, 0, Math.PI * 2);
      c.fill();
      c.fillStyle = '#ffffff';
      c.font = `700 ${Math.round(s.r * 1.15)}px 'Malgun Gothic', sans-serif`;
      c.textAlign = 'center';
      c.textBaseline = 'middle';
      c.fillText(String(s.n), s.x, s.y + s.r * 0.06);
    }
  }

  function paintScene(c) {
    // 배경 (칠판 모드 또는 스크린샷)
    if (board === 'white') { c.fillStyle = '#f8fafc'; c.fillRect(0, 0, canvas.width, canvas.height); }
    else if (board === 'black') { c.fillStyle = '#0f172a'; c.fillRect(0, 0, canvas.width, canvas.height); }
    else c.drawImage(img, 0, 0);
  }

  // 마우스 이벤트마다 그리면 한 프레임에 여러 번 그려 버벅인다 — 프레임당 한 번으로 묶는다
  let renderQueued = false;
  function requestRender() {
    if (renderQueued) return;
    renderQueued = true;
    requestAnimationFrame(() => { renderQueued = false; render(); });
  }

  function render() {
    if (!img.width) return;
    const o = origin();
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    // 배경: 전체 이미지를 변환하지 않고 "보이는 부분만" 잘라서 확대한다.
    // 3456x2234 전체를 매 프레임 변환하면 확대 중에 눈에 띄게 끊긴다.
    if (board === 'white') { ctx.fillStyle = '#f8fafc'; ctx.fillRect(0, 0, canvas.width, canvas.height); }
    else if (board === 'black') { ctx.fillStyle = '#0f172a'; ctx.fillRect(0, 0, canvas.width, canvas.height); }
    else {
      ctx.imageSmoothingEnabled = z < 2.5;   // 많이 확대하면 픽셀을 또렷하게
      ctx.drawImage(img, o.x, o.y, canvas.width / z, canvas.height / z,
                    0, 0, canvas.width, canvas.height);
    }
    ctx.setTransform(z, 0, 0, z, -o.x * z, -o.y * z);
    for (const s of strokes) drawStroke(ctx, s);
    if (current) drawStroke(ctx, current);
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    // 도구모음 상태 갱신
    zoomLabel.textContent = `${Math.round(z * 100)}%`;
    penVal.textContent = `${penScreen}px`;
    for (const sw of document.querySelectorAll('.sw')) {
      sw.classList.toggle('on', sw.dataset.c === color);
    }
    document.getElementById('btnWhite').classList.toggle('on', board === 'white');
    document.getElementById('btnBlack').classList.toggle('on', board === 'black');
    document.getElementById('btnMosaic').classList.toggle('on', mosaicMode);
    document.getElementById('hint').style.display = mosaicMode ? 'none' : '';
    document.getElementById('hint2').style.display = mosaicMode ? '' : 'none';
  }

  // ----- 마우스 -----

  window.addEventListener('mousedown', (e) => {
    if (e.target.closest && e.target.closest('#tb')) return; // 도구모음 위에서는 그리지 않음
    if (e.button === 2) return; // 우클릭은 undo (contextmenu에서)
    if (e.button !== 0) return;
    if (e.altKey) {
      // Alt+클릭 = 풀이 순서 번호 ①②③ 찍기
      const p = toImage(e.clientX, e.clientY);
      const r = (Math.max(14, penScreen * 2.6) * R()) / z;
      strokes.push({ type: 'step', x: p.x, y: p.y, r, n: ++stepSeq, color });
      render();
      return;
    }
    drawing = true;
    frozenOrigin = origin(); // 그리는 동안 화면 고정
    const p = toImage(e.clientX, e.clientY);
    const width = (penScreen * R()) / z;
    if (mosaicMode) current = { type: 'mosaic', color, width, x1: p.x, y1: p.y, x2: p.x, y2: p.y };
    else if (tabHeld) current = { type: 'ellipse', color, width, x1: p.x, y1: p.y, x2: p.x, y2: p.y };
    else if (e.ctrlKey && e.shiftKey) current = { type: 'arrow', color, width, x1: p.x, y1: p.y, x2: p.x, y2: p.y };
    else if (e.shiftKey) current = { type: 'line', color, width, x1: p.x, y1: p.y, x2: p.x, y2: p.y };
    else if (e.ctrlKey) current = { type: 'rect', color, width, x1: p.x, y1: p.y, x2: p.x, y2: p.y };
    else current = { type: 'pen', color, width, points: [p] };
    render();
  });

  window.addEventListener('mousemove', (e) => {
    // 도구모음 위에서는 화면 이동(팬)을 멈춰 조작이 편하게
    if (!(e.target.closest && e.target.closest('#tb'))) {
      lastMouse = { x: e.clientX, y: e.clientY };
    }
    if (drawing && current) {
      const p = toImage(e.clientX, e.clientY);
      if (current.type === 'pen') current.points.push(p);
      else { current.x2 = p.x; current.y2 = p.y; }
    }
    requestRender();
  });

  window.addEventListener('mouseup', (e) => {
    if (e.button !== 0 || !drawing) return;
    drawing = false;
    if (current) strokes.push(current);
    current = null;
    frozenOrigin = null;
    render();
  });

  window.addEventListener('wheel', (e) => {
    e.preventDefault();
    if (e.ctrlKey) {
      penScreen = clamp(penScreen + (e.deltaY < 0 ? 1 : -1), 2, 30);
      render();
    } else if (!drawing) {
      setTargetZ(targetZ * (e.deltaY < 0 ? 1.35 : 1 / 1.35));
    }
  }, { passive: false });

  function undo() {
    const s = strokes.pop();
    if (s && s.type === 'step') stepSeq = Math.max(0, stepSeq - 1);
    render();
  }

  // 우클릭: 확대 모드에서는 ZoomIt처럼 부드럽게 축소하며 종료,
  //         판서 모드에서는 마지막 획 취소
  window.addEventListener('contextmenu', (e) => {
    e.preventDefault();
    if (e.target.closest && e.target.closest('#tb')) return;
    if (isZoomMode) { setTargetZ(1, true); return; }
    undo();
  });

  // ----- 내보내기 -----

  function exportVisible() {
    const o = origin();
    const w = Math.round(canvas.width / z), h = Math.round(canvas.height / z);
    const c = document.createElement('canvas');
    c.width = w; c.height = h;
    const cc = c.getContext('2d');
    cc.translate(-o.x, -o.y);
    // 배경
    if (board === 'white') { cc.fillStyle = '#f8fafc'; cc.fillRect(0, 0, canvas.width, canvas.height); }
    else if (board === 'black') { cc.fillStyle = '#0f172a'; cc.fillRect(0, 0, canvas.width, canvas.height); }
    else cc.drawImage(img, 0, 0);
    // 획 (내보내기용 임시 컨텍스트에 다시 그림)
    for (const s of strokes) drawStroke(cc, s);
    return { dataURL: c.toDataURL('image/png'), w, h };
  }

  // ----- 공통 동작 -----

  function finish(action) {
    if (action === 'close') { window.api.overlayFinish({ action: 'close' }); return; }
    const { dataURL, w, h } = exportVisible();
    window.api.overlayFinish({ action, dataURL, w, h });
  }

  function clearAll() { strokes.length = 0; stepSeq = 0; render(); }
  function toggleBoard(kind) { board = board === kind ? null : kind; render(); }

  // ----- 도구모음 (마우스 조작) -----

  for (const sw of document.querySelectorAll('.sw')) {
    sw.addEventListener('click', () => { color = sw.dataset.c; render(); });
  }
  document.getElementById('penMinus').addEventListener('click', () => {
    penScreen = clamp(penScreen - 1, 2, 30); render();
  });
  document.getElementById('penPlus').addEventListener('click', () => {
    penScreen = clamp(penScreen + 1, 2, 30); render();
  });
  for (const btn of document.querySelectorAll('.tbtn[data-act]')) {
    btn.addEventListener('click', () => {
      const act = btn.dataset.act;
      if (act === 'undo') undo();
      else if (act === 'clear') clearAll();
      else if (act === 'mosaic') { mosaicMode = !mosaicMode; render(); }
      else if (act === 'white') toggleBoard('white');
      else if (act === 'black') toggleBoard('black');
      else finish(act); // pin / copy / save / close
    });
  }

  // ----- 키보드 -----

  const COLOR_KEYS = {
    r: '#ef4444', g: '#22c55e', b: '#3b82f6',
    o: '#f97316', y: '#eab308', p: '#ec4899',
  };

  window.addEventListener('keydown', (e) => {
    if (e.key === 'Tab') { e.preventDefault(); tabHeld = true; return; }
    if (e.key === 'Escape') { finish('close'); return; }
    // ZoomIt처럼 방향키로도 배율 조절
    if (e.key === 'ArrowUp') { e.preventDefault(); if (!drawing) setTargetZ(targetZ * 1.35); return; }
    if (e.key === 'ArrowDown') { e.preventDefault(); if (!drawing) setTargetZ(targetZ / 1.35); return; }
    if (e.key === 'Enter') { finish('pin'); return; }
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z') { undo(); return; }
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'c') { finish('copy'); return; }
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's') { e.preventDefault(); finish('save'); return; }
    const k = e.key.toLowerCase();
    if (k === 'e') { clearAll(); return; }
    if (k === 'm') { mosaicMode = !mosaicMode; render(); return; }
    if (k === 'w') { toggleBoard('white'); return; }
    if (k === 'k') { toggleBoard('black'); return; }
    if (COLOR_KEYS[k] && !e.ctrlKey && !e.metaKey) { color = COLOR_KEYS[k]; render(); return; }
  });

  window.addEventListener('keyup', (e) => {
    if (e.key === 'Tab') tabHeld = false;
  });
</script>
</body>
</html>
