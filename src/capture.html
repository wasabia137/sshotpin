<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; user-select: none; }
  body { cursor: crosshair; background: #000; }
  #shot {
    position: absolute; inset: 0;
    width: 100vw; height: 100vh;
    pointer-events: none;
  }
  #veil { position: absolute; inset: 0; }

  /* 선택 영역 조절 핸들 */
  .handle {
    position: absolute; display: none;
    width: 11px; height: 11px;
    background: #fff; border: 2px solid #3b82f6; border-radius: 50%;
    margin: -6px 0 0 -6px;
  }
  body.picked .handle { display: block; }
  body.tooling .handle { display: none; }

  #sizeLabel {
    position: absolute; display: none;
    background: rgba(15, 23, 42, .9); color: #e2e8f0;
    font: 12px/1.6 'Segoe UI', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif;
    padding: 2px 8px; border-radius: 6px;
    pointer-events: none; white-space: nowrap;
  }

  /* 도구모음 — 윈도우 캡처 도구처럼 흰 바탕에 선 아이콘.
     어두운 바탕 위의 이모지는 윈도우에서 뭉개져 보여서 선 아이콘(SVG)으로 그린다. */
  #toolbar {
    position: absolute; display: none;
    background: #fff;
    border: 1px solid rgba(0, 0, 0, .14);
    border-radius: 8px; padding: 6px;
    box-shadow: 0 8px 28px rgba(0, 0, 0, .28), 0 1px 3px rgba(0, 0, 0, .12);
    cursor: default;
    flex-direction: column; gap: 6px;
    font-family: 'Segoe UI Variable Text', 'Segoe UI', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif;
  }
  #toolbar.show { display: flex; }
  .trow { display: flex; align-items: center; gap: 2px; }
  #toolbar button {
    border: 1px solid transparent; border-radius: 6px;
    background: transparent; color: #1b1b1b;
    font: 14px 'Segoe UI Variable Text', 'Segoe UI', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif;
    min-width: 36px; height: 36px; padding: 0 6px; cursor: pointer;
    display: flex; align-items: center; justify-content: center; gap: 6px;
  }
  #toolbar button svg { width: 20px; height: 20px; flex: none; display: block; }
  #toolbar button:hover { background: #ededed; }
  #toolbar button:active { background: #e0e0e0; }
  /* 선택된 도구 — 윈도우 캡처 도구처럼 테두리로 감싼다 */
  #toolbar button.on {
    background: #eaf3fc;
    border-color: #005fb8;
    color: #005fb8;
  }
  /* 실행 버튼 — 파랑 채움. 도구 버튼(테두리)과 모양이 달라 눌린 상태로 읽히지 않는다 */
  #toolbar button.primary {
    padding: 0 14px 0 11px;
    background: #005fb8; color: #fff;
    font-size: 14px; font-weight: 600;
    transition: background .1s;
  }
  #toolbar button.primary:hover { background: #1a70c4; }
  #toolbar button.primary:active { background: #00509b; }
  #btnDone { padding: 0 12px; border-color: #d6d6d6; background: #fbfbfb; }
  #btnDone:hover { background: #f0f0f0; }
  .vsep { width: 1px; height: 24px; background: #e0e0e0; margin: 0 4px; }
  .sw {
    width: 20px; height: 20px; border-radius: 50%;
    border: 2px solid #fff; cursor: pointer; margin: 0 2px;
    box-shadow: 0 0 0 1px #c8c8c8;
  }
  .sw.on { box-shadow: 0 0 0 2px #005fb8; }
  #penVal { color: #1b1b1b; font-size: 13px; min-width: 34px; text-align: center; }
  #styleRow { display: none; }
  body.tooling #styleRow { display: flex; }

  /* 복사 완료 알림 — 잠깐 떠 있다 사라진다 */
  #copied {
    position: absolute; top: 24px; left: 50%;
    transform: translateX(-50%) translateY(-8px);
    background: #16a34a; color: #fff; font-weight: 600;
    font: 600 13px 'Segoe UI', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif;
    padding: 9px 18px; border-radius: 20px;
    box-shadow: 0 6px 20px rgba(0,0,0,.35);
    pointer-events: none; opacity: 0; transition: opacity .15s, transform .15s;
  }
  #copied.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  #hint {
    position: absolute; top: 24px; left: 50%; transform: translateX(-50%);
    background: rgba(15, 23, 42, .85); color: #cbd5e1;
    font: 13px 'Segoe UI', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif;
    padding: 8px 16px; border-radius: 20px;
    pointer-events: none;
  }
</style>
</head>
<body>
  <canvas id="shot"></canvas>
  <canvas id="veil"></canvas>
  <div class="handle" data-h="nw"></div>
  <div class="handle" data-h="n"></div>
  <div class="handle" data-h="ne"></div>
  <div class="handle" data-h="e"></div>
  <div class="handle" data-h="se"></div>
  <div class="handle" data-h="s"></div>
  <div class="handle" data-h="sw"></div>
  <div class="handle" data-h="w"></div>
  <div id="sizeLabel"></div>
  <div id="hint">드래그해서 영역을 선택하세요 · Enter=핀 · Esc=취소</div>
  <div id="copied">✓ 클립보드에 복사했어요</div>

  <!-- 아이콘 원본. 버튼은 <use>로 가져다 쓴다 -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <g id="i-pen" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 20l1-4.5L15.5 5a2.1 2.1 0 0 1 3 3L8 18.5 4 20z"/><path d="M13.5 7l3 3"/>
      </g>
      <g id="i-arrow" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M5 19L19 5"/><path d="M10 5h9v9"/>
      </g>
      <g id="i-rect" fill="none" stroke="currentColor" stroke-width="1.7">
        <rect x="4" y="6" width="16" height="12" rx="1.5"/>
      </g>
      <g id="i-ellipse" fill="none" stroke="currentColor" stroke-width="1.7">
        <ellipse cx="12" cy="12" rx="8" ry="6"/>
      </g>
      <g id="i-highlight" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
        <path d="M6 16l9-9a1.6 1.6 0 0 1 2.3 0l.7.7a1.6 1.6 0 0 1 0 2.3l-9 9H6v-3z"/><path d="M3 21h10"/>
      </g>
      <g id="i-mosaic" stroke="currentColor" stroke-width="1.6" fill="none">
        <rect x="4" y="4" width="16" height="16" rx="1.5"/>
        <path d="M4 9.33h16M4 14.67h16M9.33 4v16M14.67 4v16"/>
        <path fill="currentColor" stroke="none" opacity=".35" d="M4 4h5.33v5.33H4zM9.33 9.33h5.34v5.34H9.33zM14.67 4H20v5.33h-5.33zM4 14.67h5.33V20H4zM14.67 14.67H20V20h-5.33z"/>
      </g>
      <g id="i-step" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="8.5"/><path d="M12.5 16V8.5l-2 1.5"/>
      </g>
      <g id="i-undo" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
        <path d="M5 10h10a4.5 4.5 0 0 1 0 9H9"/><path d="M8.5 6.5L5 10l3.5 3.5"/>
      </g>
      <g id="i-pin" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
        <path d="M9 3h6l-1 6 3 3v2H7v-2l3-3-1-6z"/><path d="M12 14v7"/>
      </g>
      <g id="i-copy" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
        <rect x="9" y="9" width="11" height="11" rx="2"/><path d="M15 9V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v7a2 2 0 0 0 2 2h3"/>
      </g>
      <g id="i-save" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 5.5A1.5 1.5 0 0 1 5.5 4H16l4 4v10.5a1.5 1.5 0 0 1-1.5 1.5h-13A1.5 1.5 0 0 1 4 18.5z"/><path d="M8 4v5h7V4"/><path d="M8 20v-6h8v6"/>
      </g>
      <g id="i-cover" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 3l18 18"/><path d="M10.5 5.3c.5-.1 1-.1 1.5-.1 5 0 8.6 4 9.8 6.8-.5 1.1-1.3 2.4-2.5 3.6M6.6 6.6C4.5 8 3 10.2 2.2 12c1.2 2.8 4.8 6.8 9.8 6.8 1.6 0 3.1-.4 4.4-1"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/>
      </g>
      <g id="i-close" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
        <path d="M6 6l12 12M18 6L6 18"/>
      </g>
      <g id="i-minus" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M5 12h14"/></g>
      <g id="i-plus" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></g>
    </defs>
  </svg>

  <div id="toolbar">
    <div class="trow" id="toolRow">
      <button data-tool="pen" title="펜"><svg viewBox="0 0 24 24"><use href="#i-pen"/></svg></button>
      <button data-tool="arrow" title="화살표"><svg viewBox="0 0 24 24"><use href="#i-arrow"/></svg></button>
      <button data-tool="rect" title="사각형"><svg viewBox="0 0 24 24"><use href="#i-rect"/></svg></button>
      <button data-tool="ellipse" title="원"><svg viewBox="0 0 24 24"><use href="#i-ellipse"/></svg></button>
      <button data-tool="highlight" title="형광펜"><svg viewBox="0 0 24 24"><use href="#i-highlight"/></svg></button>
      <button data-tool="mosaic" title="모자이크 (개인정보 가리기)"><svg viewBox="0 0 24 24"><use href="#i-mosaic"/></svg></button>
      <button data-tool="step" title="번호 ①②③ (클릭해서 찍기)"><svg viewBox="0 0 24 24"><use href="#i-step"/></svg></button>
      <div class="vsep"></div>
      <button id="btnUndo" title="되돌리기 (Ctrl+Z)"><svg viewBox="0 0 24 24"><use href="#i-undo"/></svg></button>
      <div class="vsep"></div>
      <button id="btnPin" class="primary" title="화면에 고정 (Enter)"><svg viewBox="0 0 24 24"><use href="#i-pin"/></svg><span class="lbl">핀</span></button>
      <button id="btnCopy" title="클립보드 복사 (Ctrl+C)"><svg viewBox="0 0 24 24"><use href="#i-copy"/></svg></button>
      <button id="btnSave" title="파일로 저장 (Ctrl+S)"><svg viewBox="0 0 24 24"><use href="#i-save"/></svg></button>
      <button id="btnCover" title="이 영역을 가리개로 덮기"><svg viewBox="0 0 24 24"><use href="#i-cover"/></svg></button>
      <button id="btnCancel" title="취소 (Esc)"><svg viewBox="0 0 24 24"><use href="#i-close"/></svg></button>
    </div>
    <div class="trow" id="styleRow">
      <span class="sw" data-c="#ef4444" style="background:#ef4444" title="빨강"></span>
      <span class="sw" data-c="#f97316" style="background:#f97316" title="주황"></span>
      <span class="sw" data-c="#eab308" style="background:#eab308" title="노랑"></span>
      <span class="sw" data-c="#22c55e" style="background:#22c55e" title="초록"></span>
      <span class="sw" data-c="#3b82f6" style="background:#3b82f6" title="파랑"></span>
      <span class="sw" data-c="#1e293b" style="background:#1e293b" title="검정"></span>
      <div class="vsep"></div>
      <button id="penMinus" title="얇게"><svg viewBox="0 0 24 24"><use href="#i-minus"/></svg></button>
      <span id="penVal">4px</span>
      <button id="penPlus" title="굵게"><svg viewBox="0 0 24 24"><use href="#i-plus"/></svg></button>
      <div class="vsep"></div>
      <button id="btnDone" title="그리기 끝내고 영역 조절로 돌아가기">완료</button>
    </div>
  </div>

<script src="i18n.js"></script>
<script>
  // ----- 다국어: OS 언어에 맞춰 표시 (ko는 원문 그대로) -----
  const LANG = (window.api && window.api.locale) || 'ko';
  const T = window.I18N ? I18N.translator(LANG) : ((s) => s);
  if (LANG !== 'ko' && window.I18N) I18N.applyPage(LANG, 'capture.html', document);


  const shot = document.getElementById('shot');
  const veil = document.getElementById('veil');
  const sizeLabel = document.getElementById('sizeLabel');
  const toolbar = document.getElementById('toolbar');
  const hint = document.getElementById('hint');
  const penValEl = document.getElementById('penVal');
  const ctx = veil.getContext('2d');

  let sel = null;          // {x, y, w, h}  (화면 CSS px)
  let dragStart = null;
  let selecting = false;
  let done = false;        // 영역 확정
  let mode = 'capture';    // 'capture' | 'cover'

  let tool = null;         // null이면 영역 조절 모드
  let color = '#ef4444';
  let pen = 4;
  const anns = [];         // 주석 목록
  let cur = null;          // 그리는 중인 주석
  let drawing = false;
  let stepSeq = 0;

  let resizing = null;     // 조절 중인 핸들 방향
  let moving = false;      // 선택 영역 이동 중
  let moveOrigin = null;

  const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));
  const rx = () => shot.width / window.innerWidth;
  const ry = () => shot.height / window.innerHeight;

  // 메인에서 온 원시 비트맵(BGRA)을 캔버스에 그린다.
  // PNG로 주고받으면 인코딩·디코딩에만 0.5초가 들어 단축키 반응이 느려진다.
  function paintShot({ width, height, bitmap }) {
    const u = new Uint8ClampedArray(bitmap.buffer || bitmap);
    for (let i = 0; i < u.length; i += 4) { const b = u[i]; u[i] = u[i + 2]; u[i + 2] = b; }
    shot.width = width; shot.height = height;
    shot.getContext('2d').putImageData(new ImageData(u, width, height), 0, 0);
  }

  window.api.onCaptureInit((d) => {
    // 창을 닫지 않고 재사용하므로, 열 때마다 지난 상태를 남김없이 되돌린다
    sel = null; dragStart = null; selecting = false; done = false;
    tool = null; cur = null; drawing = false; stepSeq = 0;
    resizing = null; moving = false; moveOrigin = null;
    anns.length = 0;
    document.body.classList.remove('picked', 'tooling');
    document.body.style.cursor = 'crosshair';
    toolbar.classList.remove('show');
    sizeLabel.style.display = 'none';
    document.getElementById('copied').classList.remove('show');
    hint.textContent = T('드래그해서 영역을 선택하세요 · Enter=핀 · Esc=취소');
    hint.style.display = 'block';

    mode = d.mode || 'capture';
    paintShot(d.shot);
    resizeCanvas();
    if (mode === 'cover') {
      hint.textContent = T('🙈 가릴 영역을 드래그하세요 (놓는 즉시 가리개 생성) · Esc=취소');
    }
    // 그리기는 위에서 동기적으로 끝났으므로 곧바로 알린다.
    // (숨겨진 창에서는 requestAnimationFrame이 돌지 않아 기다리면 안 된다)
    window.api.overlayPainted();
  });

  function resizeCanvas() {
    veil.width = window.innerWidth;
    veil.height = window.innerHeight;
    draw();
  }
  window.addEventListener('resize', resizeCanvas);
  resizeCanvas();

  // ----- 주석 그리기 -----

  function drawAnn(c, a) {
    c.save();
    c.strokeStyle = a.color;
    c.fillStyle = a.color;
    c.lineWidth = a.width;
    c.lineCap = 'round';
    c.lineJoin = 'round';

    if (a.type === 'pen' || a.type === 'highlight') {
      if (a.type === 'highlight') {
        c.globalAlpha = 0.35;
        c.lineWidth = a.width * 4;
      }
      const p = a.points;
      if (p.length < 2) {
        c.beginPath();
        c.arc(p[0].x, p[0].y, c.lineWidth / 2, 0, Math.PI * 2);
        c.fill();
      } else {
        c.beginPath();
        c.moveTo(p[0].x, p[0].y);
        for (const q of p) c.lineTo(q.x, q.y);
        c.stroke();
      }
    } else if (a.type === 'rect') {
      c.strokeRect(Math.min(a.x1, a.x2), Math.min(a.y1, a.y2),
        Math.abs(a.x2 - a.x1), Math.abs(a.y2 - a.y1));
    } else if (a.type === 'ellipse') {
      c.beginPath();
      c.ellipse((a.x1 + a.x2) / 2, (a.y1 + a.y2) / 2,
        Math.abs(a.x2 - a.x1) / 2, Math.abs(a.y2 - a.y1) / 2, 0, 0, Math.PI * 2);
      c.stroke();
    } else if (a.type === 'arrow') {
      const ang = Math.atan2(a.y2 - a.y1, a.x2 - a.x1);
      const head = Math.max(a.width * 3.4, 12);
      c.beginPath();
      c.moveTo(a.x1, a.y1); c.lineTo(a.x2, a.y2); c.stroke();
      c.beginPath();
      c.moveTo(a.x2, a.y2);
      c.lineTo(a.x2 - head * Math.cos(ang - 0.45), a.y2 - head * Math.sin(ang - 0.45));
      c.lineTo(a.x2 - head * Math.cos(ang + 0.45), a.y2 - head * Math.sin(ang + 0.45));
      c.closePath(); c.fill();
    } else if (a.type === 'step') {
      const r = Math.max(11, a.width * 3);
      c.beginPath(); c.arc(a.x, a.y, r, 0, Math.PI * 2); c.fill();
      c.fillStyle = '#fff';
      c.font = `700 ${Math.round(r * 1.15)}px 'Malgun Gothic', sans-serif`;
      c.textAlign = 'center'; c.textBaseline = 'middle';
      c.fillText(String(a.n), a.x, a.y + r * 0.06);
    } else if (a.type === 'mosaic') {
      const x = Math.min(a.x1, a.x2), y = Math.min(a.y1, a.y2);
      const w = Math.abs(a.x2 - a.x1), h = Math.abs(a.y2 - a.y1);
      if (w >= 2 && h >= 2 && shot.width) {
        const cell = Math.max(5, Math.round(Math.min(w, h) / 8));
        c.beginPath(); c.rect(x, y, w, h); c.clip();
        c.imageSmoothingEnabled = false;
        for (let gy = y; gy < y + h; gy += cell) {
          for (let gx = x; gx < x + w; gx += cell) {
            // 원본 이미지의 해당 지점 1픽셀을 격자 크기로 확대
            c.drawImage(shot, Math.round(gx * rx()), Math.round(gy * ry()), 1, 1,
              gx, gy, cell, cell);
          }
        }
      }
    }
    c.restore();
  }

  function draw() {
    ctx.clearRect(0, 0, veil.width, veil.height);
    ctx.fillStyle = 'rgba(0, 0, 0, 0.4)';
    ctx.fillRect(0, 0, veil.width, veil.height);
    if (sel && sel.w > 0 && sel.h > 0) {
      ctx.clearRect(sel.x, sel.y, sel.w, sel.h);
      // 주석은 선택 영역 안에만 보이도록
      ctx.save();
      ctx.beginPath();
      ctx.rect(sel.x, sel.y, sel.w, sel.h);
      ctx.clip();
      for (const a of anns) drawAnn(ctx, a);
      if (cur) drawAnn(ctx, cur);
      ctx.restore();
      ctx.strokeStyle = '#3b82f6';
      ctx.lineWidth = 2;
      ctx.strokeRect(sel.x + 1, sel.y + 1, sel.w - 2, sel.h - 2);
    }
    placeHandles();
    penValEl.textContent = pen + 'px';
    for (const sw of document.querySelectorAll('.sw')) {
      sw.classList.toggle('on', sw.dataset.c === color);
    }
    for (const b of document.querySelectorAll('[data-tool]')) {
      b.classList.toggle('on', b.dataset.tool === tool);
    }
  }

  function placeHandles() {
    if (!sel) return;
    const pos = {
      nw: [sel.x, sel.y], n: [sel.x + sel.w / 2, sel.y], ne: [sel.x + sel.w, sel.y],
      e: [sel.x + sel.w, sel.y + sel.h / 2], se: [sel.x + sel.w, sel.y + sel.h],
      s: [sel.x + sel.w / 2, sel.y + sel.h], sw: [sel.x, sel.y + sel.h],
      w: [sel.x, sel.y + sel.h / 2],
    };
    for (const el of document.querySelectorAll('.handle')) {
      const [hx, hy] = pos[el.dataset.h];
      el.style.left = hx + 'px';
      el.style.top = hy + 'px';
      el.style.cursor = el.dataset.h.length === 2
        ? (el.dataset.h === 'nw' || el.dataset.h === 'se' ? 'nwse-resize' : 'nesw-resize')
        : (el.dataset.h === 'n' || el.dataset.h === 's' ? 'ns-resize' : 'ew-resize');
    }
  }

  function updateSizeLabel() {
    if (!sel || sel.w < 1) { sizeLabel.style.display = 'none'; return; }
    sizeLabel.textContent = `${Math.round(sel.w)} × ${Math.round(sel.h)}`;
    sizeLabel.style.display = 'block';
    const above = sel.y > 28;
    sizeLabel.style.left = sel.x + 'px';
    sizeLabel.style.top = (above ? sel.y - 26 : sel.y + 6) + 'px';
  }

  function showToolbar() {
    if (!sel) return; // 선택 영역이 없으면 놓을 자리가 없다 (sel.x 접근 시 TypeError)
    toolbar.classList.add('show');
    const tw = toolbar.offsetWidth, th = toolbar.offsetHeight;
    let tx = sel.x + sel.w - tw;
    let ty = sel.y + sel.h + 10;
    if (ty + th > window.innerHeight - 8) ty = sel.y - th - 10;
    if (ty < 8) ty = sel.y + 10;
    tx = Math.max(8, Math.min(tx, window.innerWidth - tw - 8));
    toolbar.style.left = tx + 'px';
    toolbar.style.top = ty + 'px';
  }

  function setTool(t) {
    tool = t;
    document.body.classList.toggle('tooling', !!t);
    document.body.style.cursor = t ? 'crosshair' : 'default';
    if (t) hint.style.display = 'none';
    draw();
    if (done) showToolbar(); // 영역 확정 전에는 도구모음을 띄울 자리가 없다
  }

  // ----- 마우스 -----

  window.addEventListener('mousedown', (e) => {
    if (e.button !== 0) return;
    if (e.target instanceof Node && toolbar.contains(e.target)) return;

    // 핸들로 영역 조절
    if (e.target.classList && e.target.classList.contains('handle')) {
      resizing = e.target.dataset.h;
      return;
    }

    // 도구가 켜져 있으면 주석 그리기
    if (tool && done) {
      const inside = e.clientX >= sel.x && e.clientX <= sel.x + sel.w &&
                     e.clientY >= sel.y && e.clientY <= sel.y + sel.h;
      if (!inside) return;
      if (tool === 'step') {
        anns.push({ type: 'step', x: e.clientX, y: e.clientY, color, width: pen, n: ++stepSeq });
        draw();
        return;
      }
      drawing = true;
      const p = { x: e.clientX, y: e.clientY };
      if (tool === 'pen' || tool === 'highlight') cur = { type: tool, color, width: pen, points: [p] };
      else cur = { type: tool, color, width: pen, x1: p.x, y1: p.y, x2: p.x, y2: p.y };
      draw();
      return;
    }

    // 확정된 영역 안을 드래그하면 영역 이동
    if (done && sel && e.clientX > sel.x && e.clientX < sel.x + sel.w &&
        e.clientY > sel.y && e.clientY < sel.y + sel.h) {
      moving = true;
      moveOrigin = { mx: e.clientX, my: e.clientY, x: sel.x, y: sel.y };
      return;
    }

    // 새 선택 시작 — sel을 먼저 만들어야 setTool→showToolbar가 안전하다
    toolbar.classList.remove('show');
    document.body.classList.remove('picked');
    done = false;
    anns.length = 0; stepSeq = 0;
    dragStart = { x: e.clientX, y: e.clientY };
    sel = { x: e.clientX, y: e.clientY, w: 0, h: 0 };
    setTool(null);
    document.body.style.cursor = 'crosshair'; // 드래그 중에는 십자 커서 유지
    selecting = true;
    window.api.log(`[capture] 드래그 시작 @${e.clientX},${e.clientY}`);
    hint.style.display = 'none';
    draw(); updateSizeLabel();
  });

  window.addEventListener('mousemove', (e) => {
    if (drawing && cur) {
      const p = { x: clamp(e.clientX, sel.x, sel.x + sel.w), y: clamp(e.clientY, sel.y, sel.y + sel.h) };
      if (cur.type === 'pen' || cur.type === 'highlight') cur.points.push(p);
      else { cur.x2 = p.x; cur.y2 = p.y; }
      draw();
      return;
    }
    if (resizing) {
      let { x, y, w, h } = sel;
      const r = x + w, b = y + h;
      if (resizing.includes('w')) { x = Math.min(e.clientX, r - 10); w = r - x; }
      if (resizing.includes('e')) { w = Math.max(10, e.clientX - x); }
      if (resizing.includes('n')) { y = Math.min(e.clientY, b - 10); h = b - y; }
      if (resizing.includes('s')) { h = Math.max(10, e.clientY - y); }
      sel = { x, y, w, h };
      draw(); updateSizeLabel(); showToolbar();
      return;
    }
    if (moving) {
      const nx = clamp(moveOrigin.x + (e.clientX - moveOrigin.mx), 0, window.innerWidth - sel.w);
      const ny = clamp(moveOrigin.y + (e.clientY - moveOrigin.my), 0, window.innerHeight - sel.h);
      sel.x = nx; sel.y = ny;
      draw(); updateSizeLabel(); showToolbar();
      return;
    }
    if (!selecting) return;
    sel = {
      x: Math.min(dragStart.x, e.clientX),
      y: Math.min(dragStart.y, e.clientY),
      w: Math.abs(e.clientX - dragStart.x),
      h: Math.abs(e.clientY - dragStart.y),
    };
    draw(); updateSizeLabel();
  });

  window.addEventListener('mouseup', (e) => {
    if (e.button !== 0) return;
    if (drawing) {
      drawing = false;
      if (cur) anns.push(cur);
      cur = null;
      draw();
      autoCopy();   // 그린 내용까지 포함해 다시 복사
      return;
    }
    if (resizing) { resizing = null; autoCopy(); return; }
    if (moving) { moving = false; autoCopy(); return; }
    if (!selecting) return;
    selecting = false;
    if (!sel || sel.w < 5 || sel.h < 5) {
      sel = null; draw(); updateSizeLabel();
      hint.style.display = 'block';
      return;
    }
    done = true;
    document.body.classList.add('picked');
    if (mode === 'cover') { finish('cover'); return; } // 가리개는 놓는 즉시 생성
    showToolbar();
    hint.style.display = 'none';
    draw();
    autoCopy();   // 놓는 즉시 클립보드로
  });

  // ----- 내보내기 -----

  function exportDataURL() {
    const RX = rx(), RY = ry();
    const c = document.createElement('canvas');
    c.width = Math.max(1, Math.round(sel.w * RX));
    c.height = Math.max(1, Math.round(sel.h * RY));
    const cc = c.getContext('2d');
    // 잘라낸 원본
    cc.drawImage(shot,
      Math.round(sel.x * RX), Math.round(sel.y * RY), c.width, c.height,
      0, 0, c.width, c.height);
    // 주석 (화면 좌표 → 이미지 좌표 변환)
    cc.setTransform(RX, 0, 0, RY, -sel.x * RX, -sel.y * RY);
    for (const a of anns) drawAnn(cc, a);
    cc.setTransform(1, 0, 0, 1, 0, 0);
    return c.toDataURL('image/png');
  }

  function finish(action) {
    if (action === 'cancel') { window.api.captureFinish({ action: 'cancel' }); return; }
    if (!sel || !done) return;
    if (action === 'cover') {
      window.api.captureFinish({ action: 'cover', rect: { ...sel } });
      return;
    }
    window.api.captureFinish({ action, dataURL: exportDataURL(), rect: { ...sel } });
  }

  // 선택이 확정되면 곧바로 클립보드에 넣는다. 그림을 더 얹으면 그때 다시 복사된다.
  let copyTimer = null;
  function autoCopy() {
    if (!sel || !done || sel.w < 5 || sel.h < 5) return;
    try {
      window.api.captureAutoCopy(exportDataURL());
      showCopied();
    } catch (e) { /* 복사 실패는 캡처를 막지 않는다 */ }
  }
  function showCopied() {
    const el = document.getElementById('copied');
    el.classList.add('show');
    clearTimeout(copyTimer);
    copyTimer = setTimeout(() => el.classList.remove('show'), 1400);
  }

  function undo() {
    const a = anns.pop();
    if (a && a.type === 'step') stepSeq = Math.max(0, stepSeq - 1);
    draw();
  }

  // ----- 도구모음 -----

  for (const b of document.querySelectorAll('[data-tool]')) {
    b.addEventListener('click', () => setTool(tool === b.dataset.tool ? null : b.dataset.tool));
  }
  for (const sw of document.querySelectorAll('.sw')) {
    sw.addEventListener('click', () => { color = sw.dataset.c; draw(); });
  }
  document.getElementById('penMinus').addEventListener('click', () => { pen = clamp(pen - 1, 1, 24); draw(); });
  document.getElementById('penPlus').addEventListener('click', () => { pen = clamp(pen + 1, 1, 24); draw(); });
  document.getElementById('btnUndo').addEventListener('click', undo);
  document.getElementById('btnDone').addEventListener('click', () => setTool(null));
  document.getElementById('btnPin').addEventListener('click', () => finish('pin'));
  document.getElementById('btnCopy').addEventListener('click', () => finish('copy'));
  document.getElementById('btnSave').addEventListener('click', () => finish('save'));
  document.getElementById('btnCover').addEventListener('click', () => finish('cover'));
  document.getElementById('btnCancel').addEventListener('click', () => finish('cancel'));

  // 우클릭: 도구를 쓰는 중이면 되돌리기, 아니면 캡처 취소
  window.addEventListener('contextmenu', (e) => {
    e.preventDefault();
    if (e.target instanceof Node && toolbar.contains(e.target)) return;
    if (tool && anns.length) { undo(); return; }
    if (tool) { setTool(null); return; }
    finish('cancel');
  });

  // ----- 키보드 -----

  window.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') {
      if (tool) { setTool(null); return; }  // 먼저 도구만 해제
      finish('cancel');
    }
    else if (e.key === 'Enter') finish('pin');
    else if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z') undo();
    else if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'c') finish('copy');
    else if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's') { e.preventDefault(); finish('save'); }
  });
</script>
</body>
</html>
