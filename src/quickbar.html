<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; user-select: none; background: transparent; }
  #bar {
    display: flex; align-items: center; gap: 2px;
    height: 44px; margin: 1px;
    background: rgba(15, 23, 42, .93);
    border: 1px solid rgba(148, 163, 184, .4);
    border-radius: 22px;
    padding: 0 6px;
  }
  #handle {
    width: 22px; height: 36px;
    display: flex; align-items: center; justify-content: center;
    color: #64748b; font-size: 13px; cursor: move;
  }
  .btn {
    width: 38px; height: 36px; border-radius: 11px;
    display: flex; align-items: center; justify-content: center;
    font-size: 17px; cursor: pointer;
    transition: background .12s;
  }
  .btn:hover { background: rgba(148, 163, 184, .25); }
  .btn:active { background: rgba(148, 163, 184, .4); }
  #hideBtn { width: 28px; font-size: 12px; color: #94a3b8; }
</style>
</head>
<body>
  <div id="bar">
    <div id="handle" title="드래그해서 이동">⠿</div>
    <div class="btn" data-act="capture" data-hk="capture" title="영역 캡처">📸</div>
    <div class="btn" data-act="pin" data-hk="pin" title="클립보드 이미지 핀">📌</div>
    <div class="btn" data-act="zoom" data-hk="zoom" title="화면 확대">🔍</div>
    <div class="btn" data-act="draw" data-hk="draw" title="판서">✏️</div>
    <div class="btn" data-act="timer" data-hk="timer" title="타이머">⏱️</div>
    <div class="btn" data-act="history" title="최근 캡처 다시 불러오기">🕘</div>
    <div class="btn" data-act="cover" data-hk="cover" title="가리개">🙈</div>
    <div class="btn" data-act="help" title="사용법·단축키">❓</div>
    <div class="btn" data-act="settings" title="설정 (단축키 변경·저장 폴더)">⚙️</div>
    <div class="btn" id="hideBtn" data-act="hide" title="퀵바 숨기기 (트레이에서 다시 켤 수 있어요)">✕</div>
  </div>

<script src="i18n.js"></script>
<script>
  // ----- 다국어: OS 언어에 맞춰 표시 (ko는 원문 그대로) -----
  const LANG = (window.api && window.api.locale) || 'ko';
  const T = window.I18N ? I18N.translator(LANG) : ((s) => s);
  if (LANG !== 'ko' && window.I18N) I18N.applyPage(LANG, 'quickbar.html', document);


  // 버튼 실행
  for (const el of document.querySelectorAll('.btn')) {
    el.addEventListener('click', () => window.api.quickbarAction(el.dataset.act));
  }

  // 실제 지정된 단축키를 툴팁에 표시
  window.api.onQuickbarState(({ hotkeys }) => {
    for (const el of document.querySelectorAll('[data-hk]')) {
      const accel = hotkeys[el.dataset.hk];
      const base = el.title.split(' (')[0];
      el.title = accel
        ? `${base} (${accel.replace('CommandOrControl', 'Ctrl').replace('Control', 'Ctrl')})`
        : base;
    }
  });

  // 손잡이 드래그로 이동
  const handle = document.getElementById('handle');
  let dragging = false, sx = 0, sy = 0;
  handle.addEventListener('mousedown', (e) => {
    dragging = true;
    sx = e.screenX; sy = e.screenY;
    window.api.winDragStart();
  });
  window.addEventListener('mousemove', (e) => {
    if (dragging) window.api.winDragMove(e.screenX - sx, e.screenY - sy);
  });
  window.addEventListener('mouseup', () => { dragging = false; });
  window.addEventListener('blur', () => { dragging = false; });
</script>
</body>
</html>
